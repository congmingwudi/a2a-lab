# Lab users (WS6 U1) — the demo-scale identity provider's directory.
# Login = persona + that ROLE's shared password from .env (D36:
# A2ALAB_MASTER_PASSWORD / A2ALAB_OPERATOR_PASSWORD / A2ALAB_VIEWER_PASSWORD).
# Roles:
#   master of the universe — the lab owner. Every operator permission (see
#              identity.OPERATOR_ROLES), but a DISTINCT role and password so
#              the operator login can be handed to colleagues for running
#              experiments without also handing out the owner's own login.
#   operator — everything: runs, warm-ups, harvest/analyze, raw traces
#   viewer   — everything read-only: insights, obs dashboard, Lab Guide,
#              experiment details, wire traces; execution (runs,
#              warm-ups, harvest/analyze) is operator-only
#
# `reviewer: true` is a separate grant from the role: it signs off insights
# the lab publishes under its own name (console: Insights → Approve /
# Request changes). It is deliberately NOT implied by any role — running
# an experiment and vouching for a published claim are different acts, and
# the second one is the lab owner's alone.
# Display-only relabelling for the sign-in surface (the badge + the user
# picker). The role STRING above is the functional identity — every gate,
# the JWT, the .env password env (identity.ROLE_PASSWORD_ENVS) and the wire
# user_context key off it, so it must not change. This only softens how a
# role reads on screen; anything not listed shows its role verbatim.
role_labels:
  master of the universe: master of this universe

users:
  ryan:
    name: Ryan Cox
    role: master of the universe
    reviewer: true
  ana:
    name: Ana the Architect
    role: operator
  vic:
    name: Vic the Visitor
    role: viewer
