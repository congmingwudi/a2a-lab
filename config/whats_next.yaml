# What's Next — the lab's roadmap horizon, published in the console's
# "What's Next" section. These are the answer to "where do you go from
# here?" — higher-altitude than a workstream and deliberately less detailed:
# a plan graduates INTO a workstream (plan/07-workstreams.md) and picks up
# decisions (plan/00-decisions.md) as it gets built, and the chips below track
# that graduation. An entry with a `workstream:` has already crossed that line.
#
# This file is the single source of truth for the section (served at
# GET /api/whats-next); config/ is COPYd into the console image, so a new plan
# here ships with the next console rebuild — no code change needed.
#
# horizon legend — HOW FAR ALONG the plan is, not how important it is:
#   exploring   an idea being pressure-tested; no workstream yet
#   planned     accepted into the roadmap as a workstream, build not started
#   in-flight   actively being built right now
#   done        built and incorporated into the lab — kept here on purpose,
#               rendered under a "What's Done" divider at the BOTTOM of the
#               section so the roadmap reads as a story from idea to shipped
#               rather than losing the finished ones. A done plan graduated
#               through the horizons above; it is not deleted, it is retired
#               into the record.
#
# Each entry:
#   title      the plan, one line
#   pitch      what it is (the one-line statement of the plan)
#   payoff     what the lab would LEARN from it — the reason it's on the list
#   platforms  vendor/platform tags → rendered as logo-marked chips (withLogos
#              / tagChipsHtml); use the same tag ids the rest of the console
#              does (claude, openai, adk, foundry, salesforce, aws, ...)
#   specs      relevant protocols/specifications → chips (a2a, mcp, ...)
#   workstream (optional) the WS id once it has graduated; renders a chip that
#              opens plan/07-workstreams.md
#   refs       (optional) D<n> and plan/*.md tokens — chip automatically via the
#              console's linkifier, same as insights refs
#   landing    (optional, done only) true if this finished capability should
#              also surface on the public landing page as something the lab
#              shows. The mechanism reads this flag; nothing is promoted until
#              an entry sets it (today none do — the flag ships empty on
#              purpose, so the landing page changes deliberately, not as a
#              side effect of a plan reaching done).

plans:
  - id: other-agent-frameworks
    title: Introduce experiments for other agent platforms
    horizon: planned
    pitch: >
      Add lab experiments for the orchestration frameworks the estate does not
      yet cover — LangGraph (WS4), CrewAI, and AutoGen (Microsoft) — each hosted
      the same way the existing platforms are and wired into the same delegation
      and trace seams, so a new framework is a directory under src/platforms/,
      not a change to the core.
    payoff: >
      The lab's claim is that adding a platform touches nothing in interop/ or the
      other platforms — these are the entries that keep testing it, and each
      framework answers the same questions the others already have: does it speak
      A2A natively or need a shim, where does it carry the trace id, and what does
      its own execution log say it did. LangGraph is the closest (already a roadmap
      workstream); CrewAI and AutoGen widen the sample to the multi-agent
      orchestrators.
    platforms: [langgraph, crewai, autogen, microsoft]
    specs: [a2a, mcp]
    workstream: WS4
    refs: [plan/07-workstreams.md]

  - id: agentforce-to-agentforce-moma
    title: Agentforce as native orchestrator — MOMA + third-party A2A (not yet available)
    horizon: exploring
    pitch: >
      Salesforce is turning Agentforce into a multi-agent PLATFORM, not just a
      single agent that can delegate: a Superagent lifecycle (discover · register ·
      test · publish · observe) with three orchestration shapes on one spectrum —
      Single Org Multiple Agents (SOMA — tracked as its own entry below), Multiple
      Org Multiple Agents (MOMA — an Agentforce agent in one org orchestrating an
      Agentforce agent in ANOTHER org), and native A2A where Agentforce
      orchestrates third-party agents (Google, AWS, …) AND is orchestrated by them.
      This entry tracks the two the lab cannot run yet: MOMA and native
      bidirectional third-party A2A. Every Agentforce experiment to date runs it as
      one END of a cross-platform pair (Path A/B/C — each caller gets its own
      Agentforce twin, D25) reached through the lab's OWN hosted A2A shim (D28),
      never Agentforce orchestrating natively. It must WAIT for the product: MOMA
      is marked not-currently-available, and native third-party A2A (both
      directions) is slated for a later Salesforce release — so this stays
      exploring until the capability ships.
    payoff: >
      The waiting is itself part of the finding: when native support lands, the lab
      records what "native" buys over the shim it runs today. The questions are
      concrete — does native Agentforce A2A ride the same wire the hosted shim
      already taps (D28), or a Salesforce-internal channel the wiretap never sees;
      how does trace correlation survive an org→org or vendor→vendor hop when
      Agentforce OWNS the orchestration (it logs each subagent as an independent
      session trace, linked by a delegation step and a previous-session id — the
      platform-native analogue of the lab's own X-Trace-Id stitching); and what
      cross-org identity and trust look like when caller and callee are both
      Agentforce rather than two clouds. MOMA also forces the lab's first SECOND
      org — every experiment so far deploys into one production org — so what that
      setup costs to stand up is part of the finding.
    platforms: [salesforce, adk, aws]
    specs: [a2a, mcp]
    refs: [D25, D28, plan/02-matrix.md]

  - id: agentforce-soma-single-org
    title: Agentforce SOMA — one org, multiple agents orchestrated natively
    horizon: exploring
    pitch: >
      Salesforce's SOMA (Single Org, Multiple Agents): a native orchestrator agent
      in ONE org routing to specialized subagents — deterministic routing, up to
      seven agents, connected subagents — inside Agentforce Builder, with no A2A
      wire and no second org. In open beta today, so it needs enabling in the lab's
      org before it can be exercised. This is the nearer-term, self-contained
      sibling of the cross-org / third-party A2A work tracked above, and a SEPARATE
      experiment.
    payoff: >
      SOMA is the one multi-agent shape the lab can actually run soon, and it is
      the control case for the rest: orchestration with NO wire between agents and
      NO trust boundary crossed, so the trace it produces is the clean baseline the
      cross-org (MOMA) and cross-vendor (A2A) hops get measured against. It also
      lets the lab read Agentforce's own multi-agent observability first-hand — the
      unified session trace, the per-subagent independent traces, the reasoning /
      classifier / trust-guardrail spans — and ask how that native view lines up
      with the lab's per-hop wire trace for the same run.
    platforms: [salesforce]
    specs: []
    refs: [D25, plan/02-matrix.md]

  - id: mulesoft-agent-fabric
    title: MuleSoft Agent Fabric vs the lab's own AWS control plane
    horizon: planned
    pitch: >
      Stand up MuleSoft's Agent Fabric against the agents this lab already
      built and point a bought "manage-your-A2A" product — registry, security,
      governance, observability — at the same fleet the lab governs with custom
      AWS plumbing.
    payoff: >
      A like-for-like read on build-vs-buy for agent-to-agent operations: where
      a productised fabric already does what the lab hand-rolled (Agent Fabric
      has independently productised four mechanisms the lab built), and where
      its own shape — an Omni Gateway that cannot easily present the SigV4-only
      AWS control plane — meets the seams the lab exists to expose.
    platforms: [salesforce, aws]
    specs: [a2a, mcp]
    workstream: WS10
    refs: [plan/07-workstreams.md]

  - id: agent-memory-across-platforms
    title: How each agent platform does agent memory
    horizon: exploring
    pitch: >
      Run the same "remember this across turns / across sessions" probe against
      every platform in the lab and record what each actually persists, where it
      lives, and who can read it back.
    payoff: >
      Memory is the next axis the lab has not measured. The same cross-vendor
      seam that makes delegation interesting applies here: whose store, under
      whose trust boundary, surviving which hops — and whether memory travels
      with a delegated request or stays stranded on the platform that holds it.
    platforms: [claude, openai, adk, foundry, salesforce]
    specs: []

  - id: agent-plugins-spec
    title: Agent Plugins spec support across the platforms
    horizon: exploring
    pitch: >
      Track how Anthropic, OpenAI, Google and AWS support — or plan to support —
      the vendor-neutral Agent Plugins specification (agentplugins/
      agent-plugins-spec), and test whether a plugin authored once loads across
      more than one platform in the lab.
    payoff: >
      A live read on whether a shared plugin/skill package is real portability
      or paper agreement. It also lets the lab watch how these standards actually
      form — the spec was structurally derived from Claude Code's plugin format,
      which is de-facto adoption of whoever's format was concrete enough to copy,
      the same pattern SKILL.md is riding.
    platforms: [anthropic, openai, gcloud, aws]
    specs: [agent-plugins, mcp]

  - id: datacloud-tableau-next
    title: Zero Copy the obs store into Data Cloud → Tableau Next + Analytics Agent
    horizon: in-flight
    pitch: >
      Federate the lab's observability database into Salesforce Data 360 with
      Zero Copy — no ETL, no second copy — put a semantic model over it, and
      analyse the cross-platform traces in Tableau Next and with the native
      Salesforce Analytics Agent.
    payoff: >
      Two readings of the same truth that Zero Copy guarantees can never
      diverge: the trace viewer is the wire-level, per-hop record; Data 360 plus
      Tableau is the business-analytics rollup a Salesforce analyst would use —
      federated in place so rows never leave us-east-1.
    platforms: [salesforce, aws]
    specs: []
    workstream: WS19
    refs: [D69, D70, plan/03-results.md, plan/07-workstreams.md]

  - id: async-long-running-tasks
    title: A2A async long-running tasks — fire the work, poll it to done
    horizon: in-flight
    pitch: >
      Add a per-experiment dispatch choice — synchronous (one blocking call per
      agent, every run to date) or asynchronous (the A2A long-running-task
      pattern: submit the work, get a task id back in ~1s, then poll tasks/get
      until it reaches a terminal state) — and build it end to end in one
      orchestrator experiment first, so the pattern is understood before it
      spreads to the others.
    payoff: >
      The realistic shape of cross-platform work: nobody holds an HTTP request
      open while another company's agent thinks for minutes. Asking WHO actually
      implements the asynchronous half of A2A is itself the finding — the two
      A2A legs (ADK, Foundry) run the real submit/poll lifecycle, while the
      AgentCore leg has no task lifecycle and falls back to a blocking call,
      recorded as async→sync rather than hidden. Folding the poll count and the
      per-leg mode into the lab's observability turns "async is supported" from
      a spec claim into a measured, per-platform account.
    platforms: [claude, openai, adk, foundry]
    specs: [a2a]
    workstream: WS11
    refs: [D47, plan/07-workstreams.md]

  - id: agentforce-otel-session-trace-api
    title: Agentforce Session Trace OTel API — a standard route to the obs data
    horizon: in-flight
    pitch: >
      Harvest the Agentforce observability data through Salesforce's new
      [Session Trace OpenTelemetry API](https://developer.salesforce.com/docs/ai/agentforce/guide/otel-api.html)
      (beta) — `GET /einstein/audit/otel/{session-id}`, which returns a
      session's trace as an OTLP resourceSpans document (turns, messages, LLM
      calls, actions, metric scores, feedback) — as a second, standards-shaped
      route to the SAME data the live harvest assembles today from four Data 360
      Session Tracing DMOs. Built now (source + tests, WS23/D73) under its own
      `salesforce-otel` name; the DMO batch path stays the LIVE harvest.
    payoff: >
      A clean read on what a vendor's "OpenTelemetry API" actually is: usually a
      standard, pre-joined ROUTE to data you can already reach — here the same
      Data 360 record the Data Cloud API serves in batch — not new information.
      The win is engineering (the server does the join, so the orphan bug class
      the manual FK walk once caused cannot occur; a stable OTLP schema replaces
      drift-prone `ssot__*` column heuristics; one round trip per session, not
      four paged DMO scans), and it is deliberately NOT the live path yet: the
      API is single-session, 72h-lookback and beta — all fatal to the bulk
      coverage sweep the DMO path serves — so it ships alongside, proven the same
      data, one line from promotion the day it grows a bulk read.
    platforms: [salesforce]
    specs: [otel]
    workstream: WS23
    refs: [D73, plan/05-observability.md, plan/07-workstreams.md]

  - id: claude-science-overlays
    title: Claude Science patterns overlaid on the lab's insights + method
    horizon: done
    pitch: >
      Borrow the provenance and review ideas from Anthropic's Claude Science
      workbench and apply them to the lab: derive an insight's evidence tier
      from whether its backing artifact re-executes, run an actor-critic
      reviewer over insights.yaml, and name session-forking as a repeatable
      experiment method.
    payoff: >
      Claude Science is a reference architecture for a vertical workbench applied
      to a domain nobody has packaged. What transfers is the epistemics, not the
      biology: a claim's tier should be a property you can test by re-running,
      not a label an author typed — the same trust-under-pressure move as the
      cost sentinel refusing a comparison it could not back.
    platforms: [anthropic]
    specs: []
    workstream: WS20
    refs: [plan/01-architecture.md, plan/02-matrix.md, plan/07-workstreams.md, plan/08-insights.md]

  - id: moirai-timeseries-forecasting
    title: Moirai time-series foundation model + MoiraiAgent over the lab's telemetry
    horizon: exploring
    pitch: >
      Point Salesforce AI Research's Moirai time-series foundation model — and
      the context-aware MoiraiAgent around it — at the lab's telemetry, on two
      tracks: the A2A experiment traces (latency, volume, error, cost), and the
      lab's own INFRASTRUCTURE metrics (CloudWatch across the AWS runtime, GCP
      Vertex, Azure Monitor for Foundry) for a predictive site-reliability read.
    payoff: >
      Learned anomaly bands instead of hand-set thresholds; predictive capacity
      for the scale-to-zero Aurora/Fargate estate; a cross-cloud read the matrix
      can't give — whose runtime is most PREDICTABLE, not just fastest; and one
      differentiated test few others can run: feeding the dated ADR log (plan/00)
      as MoiraiAgent's natural-language context channel so a forecast reasons
      over "on this date the backend swapped." The infra track is the better data
      fit (dense, regular, no load harness needed) and also fills a real gap — AWS
      and Azure runtime metrics aren't harvested today. Honest meta-finding
      throughout: does a TSFM pretrained on electricity and retail generalize to
      this telemetry at all?
    platforms: [salesforce, aws, gcloud, microsoft]
    specs: []
    refs: [plan/explore-moirai-timeseries-forecasting.md, plan/05-observability.md, plan/09-deployment-map.md, D23, D44]
