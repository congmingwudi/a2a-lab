  # ---- WS8: fan-out orchestration (the lab's first 1:many topology) --------
  supplier-disruption-cma:
    group: fan-out
    title: "Supplier Disruption — orchestrated by Claude (Managed Agents)"
    summary: >
      An Anthropic Managed Agent orchestrates three business-unit agents on
      three platforms — Google ADK, Microsoft Foundry and OpenAI — then writes
      the brief. Run it two ways: ONE host-side custom tool, where the host owns
      concurrency, or one REMOTE MCP tool per unit, where the model does. Same
      agent, same prompt; the topology is the variable (D41).
    target: claude-rest
    mode: fanout
    orchestrator: cma
    # The two tool inventories are swapped per run via agent_with_overrides —
    # a prompt cannot add a tool, so this has to be a run-time control rather
    # than a second scenario that would drift from this one.
    fanout_variant_toggle: true
    # Per-run choice of HOW the host-side fan-out calls each leg (WS11/D47):
    # "sync" is the blocking ask() every run used before, "async" is the A2A
    # fire-then-poll long-running-task pattern — submit returns a task id in
    # ~1s, then the host polls tasks/get to a terminal state. Only meaningful
    # under the host-side "tool" variant (the console gates the radio on it);
    # under "mcp" the legs run inside the Lambda's MCP tools and this host does
    # not dispatch them. The two A2A legs (ADK, Foundry) run the real lifecycle;
    # the AgentCore comms leg has no task lifecycle and is recorded async→sync.
    dispatch_mode_toggle: true
    via_bridge: false
    status: live
    requires_mode: hosted
    tags: [fan-out, orchestration, claude, managed-agents, adk, foundry, openai, async]
    # The kick-off prompt IS the disruption. Every other scenario asks a
    # question; this one reports a situation, because that is what an
    # orchestrator is for — nobody types "please fan out to three business
    # units", they say what happened and expect the routing to be the agent's
    # problem. Console prefills this; run_fanout.py's --task default matches.
    question: >-
      A port strike has halted all container traffic through Rotterdam as of
      06:00 today. Assess the impact for our EU manufacturing customers.
    description: >
      THE SITUATION. A port strike halts container traffic through a major hub.
      A multinational manufacturer needs to know, within the hour: which orders
      are exposed, what the contracts say about delay penalties and force
      majeure, and what to tell affected customers — then act on all three.


      WHY IT NEEDS MULTIPLE AGENTS. These three questions are owned by three
      different functions, grounded in three different systems, and — in a
      company of any size — served by three different AI platforms chosen by
      three different business units at three different times. Logistics runs
      on Google Cloud. Commercial and legal run on Microsoft. Customer
      operations standardised on OpenAI. Nobody is going to re-platform because
      a strike started at 6am.


      WHY ORCHESTRATION RATHER THAN A CHAIN. The three questions are genuinely
      independent — exposure does not depend on the contract position, and
      neither depends on the customer message. Run sequentially they cost the
      sum of three latencies; run in parallel they cost the slowest. In a
      disruption that difference is the whole value.


      WHY ASYNC. Nobody sits watching a spinner during a port strike. The work
      is dispatched, runs for minutes, and lands in the systems people already
      use — which is what the lab's async pattern (D16) already proved by
      delivering briefs into CRM records rather than into an HTTP response.


      WHAT THE POLLING LOOKS LIKE — AND WHY GOOGLE'S RESEMBLES AN ERROR.
      Async here is A2A's own long-running-task lifecycle: `submit` returns a
      task id in ~1s (`configuration.return_immediately`), then the orchestrator
      polls `tasks/get` until the task reaches a terminal state (WS11, D47). The
      two A2A legs implement that lifecycle differently, and the trace shows it.
      Microsoft Foundry answers every poll with a fully-formed task status from
      the first call — a clean `WORKING → COMPLETED` progression, each `tasks/get`
      a normal success. Google's Vertex AI Agent Engine does not: its task store
      is eventually consistent, so `tasks/get` on a task that exists but has not
      finished returns 404, which the A2A REST transport surfaces as
      `MethodNotFoundError: Resource not found: .../a2a/tasks/<id>`. You see a
      string of what look like failed calls to a wrong endpoint — then, at the
      SAME URL, the completed task with its artifact. Nothing was misaddressed
      and no call was malformed; it is the platform saying "not ready yet" in the
      only vocabulary a 404 has. The lab rides through it (a grace window bounded
      by the leg deadline) and records those pre-completion polls as `pending`,
      not as errors, because they are expected rather than broken
      (plan/03-results.md).


      WHY THAT IS WORTH A SECOND LOOK. A2A exists to give agent work a
      task-management surface — ids, states, poll-for-progress — precisely so a
      caller need not guess whether "no answer yet" means "still working" or
      "gone". An implementation that answers an in-flight poll with a 404
      collapses that distinction back into the ambiguity the task lifecycle was
      meant to remove: it is the same status code a genuinely unknown task
      returns. Foundry's immediate, fully-formed status is what the protocol
      seems to intend; Agent Engine's 404-until-ready is defensible as an
      eventually-consistent store, but it pushes the "transient or fatal?"
      judgement back onto the client. The lab's poller resolves it by treating
      the 404 as the store flapping, not a fault: a task read once PROVES the
      endpoint serves task reads, so a later 404 — session 2026-08-12 recorded
      one arriving even AFTER a successful poll, then the task completed — is
      ridden through to completion rather than failing the leg or falling back
      to sync. Only an endpoint that never yields the task at all (a 404 from
      the first poll that never clears within the grace window) is treated as
      genuinely submit-only and degraded to a blocking call, recorded
      async→sync. An earlier version got this wrong — it called any 404 after
      the first read fatal, which switched a fully-async-capable Agent Engine
      leg to sync the moment its store flapped (fixed 2026-08-12).


      WHAT IT MEASURES. Three things nothing else in the lab touches: the D27
      delegation guard under PARALLEL dispatch rather than chaining; whether a
      single run can be correlated across four platforms' own execution logs
      (expect 3 of 4 — Foundry logs no utterance text, so it joins by
      platform_ref instead of by the D34 rider); and partial failure, which at
      fan-out is the normal case rather than the edge case.


      THE CLAIM IT SUPPORTS. An enterprise does not need one agent platform. It
      needs one protocol and an honest account of what crossing platform
      boundaries costs — in latency, in identity plumbing, and in the
      observability you lose at each seam.
    note: >
      Partial-failure policy is deliberate and visible: a leg that fails is
      REPORTED, never omitted. Each failed leg renders "[leg unavailable:
      <platform> — <reason>]" and every run carries a coverage line, so a
      degraded run cannot read like a complete one. That is a direct response
      to the 2026-07-25 measurement of Agentforce abandoning a slow action —
      HTTP 200, section heading present, delegated content silently gone, full
      cost paid. Built twice (Anthropic Managed Agents and Google ADK
      orchestrators) because cron-scheduled and duration-based async are two
      different patterns sharing one word. Sibling business cases in other
      domains — vendor diligence, incident triage, M&A — are documented in
      plan/07-workstreams.md WS8.
    flow:
      - source: operator
        target: a2alab-supply-orchestrator
        protocol: managed-agents-api
        detail: "The disruption task opens an Anthropic Managed Agents session.
          The agent is a DECLARATIVE control-plane object — name, model, system
          prompt, tool schemas — and its one tool is `custom`, which on this
          platform means the HOST executes it. The model decides only WHEN to
          fan out; the host owns concurrency, per-leg timeouts and the
          partial-failure contract."
      - source: a2alab-supply-orchestrator
        target: adk-logistics-a2a
        protocol: a2a
        detail: "LEG 1 — Logistics BU. Exposure assessment from the Gemini
          agent on Agent Engine. Dispatched concurrently with legs 2 and 3;
          D27 rider at depth 1, lab-trace line stamped."
      - source: a2alab-supply-orchestrator
        target: foundry-commercial-a2a
        protocol: a2a
        detail: "LEG 2 — Commercial/Legal BU. Contract and penalty position
          from gpt-5-mini on Microsoft Foundry, over its native inbound A2A."
      - source: a2alab-supply-orchestrator
        target: openai-agentcore
        protocol: agentcore-http
        detail: "LEG 3 — Customer operations BU. Customer comms points from
          the OpenAI agent on Bedrock AgentCore (SigV4)."
      - source: a2alab-supply-orchestrator
        target: operator
        protocol: internal
        detail: "Synthesis. The orchestrator receives all three sections plus
          a coverage line and writes one brief. Delivery into Salesforce reuses
          the D16/D17 brief path."
    # The three business-unit legs (the orchestrator is an Anthropic Managed
    # Agent — a declarative control-plane object with no public A2A card, so it
    # has no card to fetch; it is drawn in the flow above).
    agents:
      - title: "Logistics BU — exposure (Google ADK · Gemini)"
        target: adk-logistics-a2a
        caption: >-
          Fan-out leg 1. The Logistics unit's OWN Agent Engine deployment. Its
          A2A card is synthesized locally — Agent Engine's preview A2A surface
          serves no public card route, so the client pins the transport (D26).
      - title: "Commercial / Legal BU — contract & penalty position (Microsoft Foundry)"
        target: foundry-commercial-a2a
        caption: >-
          Fan-out leg 2. gpt-5-mini on Microsoft Foundry over its native inbound
          A2A (Entra-authed). Honest status: native.
      - title: "Customer operations BU — customer comms (OpenAI · Bedrock AgentCore)"
        target: openai-agentcore
        caption: >-
          Fan-out leg 3. The OpenAI agent on Bedrock AgentCore, reached over
          agentcore-http with SigV4 — not A2A, so it publishes no public agent
          card.

  supplier-disruption-adk:
    group: fan-out
    title: "Supplier Disruption — orchestrated by Google ADK (ParallelAgent)"
    summary: >
      The SAME scenario and the same three business-unit agents, orchestrated by
      Google ADK on Vertex AI Agent Engine. Here the fan-out is DECLARED in the
      agent graph — SequentialAgent[ParallelAgent[3 units] → synthesiser] — so
      the framework schedules the concurrency and no lab host is attached.
    target: adk-orchestrator-a2a
    via_bridge: false
    # The console drives this orchestrator with A2A fire-then-poll, never a
    # blocking ask() (WS11). A blocking `message:send` runs the WHOLE
    # SequentialAgent[ParallelAgent→synthesiser] graph inline on Agent Engine,
    # which measured ~105-134s and returns HTTP 400 "Reasoning Engine Execution
    # failed" past ~105s (or outlives the 120s shared-ALB idle timeout).
    # `submit` returns a task id in ~1-2s and the console then polls tasks/get to
    # a terminal state — the poll loop runs in the browser, so no single request
    # is held open across the ~2-minute graph. Measured 2026-08-12.
    console_dispatch: submit_poll
    # Per-run choice of HOW each declared leg calls its A2A tool (WS11/D47):
    # "sync" is a blocking ask(), "async" fires the A2A submit + poll lifecycle.
    # Both route through the SAME orchestration.runner.run_one the Managed
    # Agents host tool uses; the only difference from that variant is WHERE the
    # poll loop runs — here it runs inside the ParallelAgent branch, in the GCP
    # container, driven by the graph rather than by a lab host or a model. The
    # two A2A legs (ADK, Foundry) run the real lifecycle; the AgentCore comms
    # leg has no task lifecycle and is recorded async→sync.
    dispatch_mode_toggle: true
    status: live
    tags: [fan-out, orchestration, adk, agent-engine, gemini, foundry, openai, parallel-agent, async]
    # Deliberately the SAME words as the CMA variant: the comparison is only
    # honest if both orchestrators are handed an identical situation.
    question: >-
      A port strike has halted all container traffic through Rotterdam as of
      06:00 today. Assess the impact for our EU manufacturing customers.
    description: >
      SAME SCENARIO, DIFFERENT ORCHESTRATOR. The situation, the three business
      units and their agents are identical to the Claude-orchestrated run — what
      changes is WHERE THE FAN-OUT LIVES, and that is the whole point of building
      it twice.


      ON ANTHROPIC MANAGED AGENTS the orchestrator is a declarative
      control-plane object (name, model, system prompt, tool schemas) and its
      fan-out tool is a `custom` tool, which on that platform means the HOST
      executes it. The model decides only WHEN to fan out; the lab's code owns
      concurrency, per-leg timeouts and the partial-failure contract. A rule
      enforced in code cannot be talked out of by a model — but the orchestrator
      cannot run unattended, because something must service the tool.


      ON GOOGLE ADK the orchestrator is code in a container and the fan-out is
      DECLARED: a ParallelAgent whose sub-agents are the three business units,
      wrapped in a SequentialAgent that synthesises afterwards. The framework
      schedules the concurrency, ordering is structural rather than prompted,
      and each unit writes to a named state key the synthesiser interpolates.
      Nothing calls back to a lab host, so it runs by itself.


      THE TRADE, STATED PLAINLY: one buys you control at the seam, the other
      structure in the graph, and neither gives you both. The declared graph
      guarantees the units run before the synthesiser — but the
      "[leg unavailable: ...]" markers survive only if three separate models
      relay them faithfully, where the host-side variant produces those markers
      in code. Declared structure buys ordering guarantees; it does not buy
      fidelity of content.


      SYNC OR ASYNC — AND WHERE THE POLL LOOP RUNS (WS11). Each declared leg can
      call its business unit the blocking way or with A2A's fire-then-poll
      long-running-task lifecycle: `submit` returns a task id in ~1s, then the
      leg tool polls `tasks/get` to a terminal state. It is the SAME submit/poll
      code (orchestration.runner.run_one) the Claude-orchestrated run uses — the
      flapping-404 ride-through on Agent Engine, the partial-failure contract,
      all shared — so the only thing that moves is WHERE the loop physically
      runs: inside the ParallelAgent branch, in the GCP container, driven by the
      graph. Nothing calls back to a lab host and no API gateway sits in front of
      a leg, so an async leg gets the full off-request budget, bounded only by
      the orchestrator's own A2A deadline. This is the same fire-then-poll the
      Managed Agents variant offers, expressed at the third point on the
      who-owns-concurrency axis.
    note: >
      Deployed as its own Agent Engine (deploy/adk/deploy_adk.py --role
      orchestrator). status: coming-soon until a clean live run is recorded —
      the customer-comms leg calls Bedrock AgentCore, which needs AWS
      credentials inside a GCP container, and that cross-cloud identity edge
      (AWS←GCP) is the one direction the lab has not yet wired. Expect that leg
      to render as "[leg unavailable: openai — ...]" until it is, which is the
      partial-failure contract doing its job rather than a broken scenario.
    flow:
      - source: remote-caller
        target: adk-orchestrator-a2a
        protocol: a2a
        detail: "The disruption task arrives at Agent Engine's platform-native
          A2A endpoint. Inside, a SequentialAgent runs a ParallelAgent of three
          business-unit sub-agents, then a synthesiser."
      - source: adk-orchestrator
        target: adk-logistics-a2a
        protocol: a2a
        detail: "LEG 1 — Logistics BU, scheduled concurrently by ParallelAgent.
          Each unit is an LlmAgent with one A2A tool and an output_key."
      - source: adk-orchestrator
        target: foundry-commercial-a2a
        protocol: a2a
        detail: "LEG 2 — Commercial/Legal BU on Azure. Cross-cloud from the GCP
          container, using the Entra service principal (the sanctioned
          service-identity pattern, same as the WS3 capstone)."
      - source: adk-orchestrator
        target: openai-agentcore
        protocol: agentcore-http
        detail: "LEG 3 — Customer operations on AWS. Needs SigV4 from inside a
          GCP container; until that identity is wired the leg reports as
          unavailable rather than silently vanishing."
      - source: adk-orchestrator
        target: remote-caller
        protocol: a2a
        detail: "The synthesiser reads the three state keys and writes one
          brief, reporting any unit that did not answer as an explicit gap."
    agents:
      - title: "Orchestrator — ParallelAgent fan-out (Google ADK · Agent Engine)"
        target: adk-orchestrator-a2a
        caption: >-
          The declared fan-out itself: SequentialAgent[ParallelAgent[3 units] →
          synthesiser], its own Agent Engine deployment. A2A card synthesized
          locally (preview A2A serves no public card route).
      - title: "Logistics BU — exposure (Google ADK · Gemini)"
        target: adk-logistics-a2a
        caption: >-
          Fan-out leg 1. The Logistics unit's OWN Agent Engine deployment. Its
          A2A card is synthesized locally — Agent Engine's preview A2A surface
          serves no public card route, so the client pins the transport (D26).
      - title: "Commercial / Legal BU — contract & penalty position (Microsoft Foundry)"
        target: foundry-commercial-a2a
        caption: >-
          Fan-out leg 2. gpt-5-mini on Microsoft Foundry over its native inbound
          A2A (Entra-authed). Honest status: native.
      - title: "Customer operations BU — customer comms (OpenAI · Bedrock AgentCore)"
        target: openai-agentcore
        caption: >-
          Fan-out leg 3. The OpenAI agent on Bedrock AgentCore, reached over
          agentcore-http with SigV4 — not A2A, so it publishes no public agent
          card.

  supplier-disruption-agentforce:
    group: fan-out
    title: "Supplier Disruption — orchestrated by Agentforce"
    summary: >
      The SAME scenario and the same three business-unit agents, orchestrated
      by an Agentforce agent authored in Agent Script (D14). This is the third
      point on the who-owns-concurrency axis: a host owns it on Managed Agents,
      a graph declares it on ADK, and here a serial Apex budget CONSTRAINS it.
      Run it two ways, toggled per run — DELEGATED (the default): one Apex
      callout hands the fan-out to the bridge, which runs the three legs in
      parallel off-platform; or SERIAL: three stacked Apex callouts, which a
      real three-leg run overruns by design. The constraint is the finding.
    target: agentforce-orchestrator-rest
    af_topology_toggle: true
    # Per-run choice of HOW the DELEGATED fan-out dispatches its legs (WS11/D47):
    # "sync" is the bridge's blocking ask() per leg, "async" is A2A fire-then-
    # poll. Agentforce itself CANNOT poll — its only GA outbound is one serial
    # Apex callout — so the async loop runs at the BRIDGE, on the orchestrator's
    # behalf, during the single callout Apex holds open (~110s bound, no gateway
    # ceiling: the bridge is long-lived Fargate). The mode rides the situation as
    # an [A2A-LAB ROUTING] fanout-dispatch block (dispatch_block); the bridge
    # reads it (read_dispatch_mode) and strips it before the legs see it; absent
    # → sync, never an error. Only meaningful under the DELEGATED topology.
    dispatch_mode_toggle: true
    via_bridge: false
    status: live
    tags: [fan-out, orchestration, agentforce, agent-api, bridge, adk, foundry, openai, async]
    # Deliberately the SAME words as the CMA and ADK variants: the comparison is
    # only honest if all three orchestrators are handed an identical situation.
    question: >-
      A port strike has halted all container traffic through Rotterdam as of
      06:00 today. Assess the impact for our EU manufacturing customers.
    description: >
      SAME SCENARIO, A THIRD ORCHESTRATOR. The situation, the three business
      units and their agents are identical to the Claude- and ADK-orchestrated
      runs — what changes is WHO OWNS THE CONCURRENCY, and that is the whole
      point of building it a third time.


      ON ANTHROPIC MANAGED AGENTS the fan-out is a `custom` tool the HOST
      executes: the lab's code owns concurrency, per-leg timeouts and the
      partial-failure contract. ON GOOGLE ADK the fan-out is DECLARED in the
      agent graph — a ParallelAgent the framework schedules. ON AGENTFORCE
      there is no host tool and no parallel graph: the only GA outbound is Path
      A (an Apex callout through the lab bridge), and Apex callouts are SERIAL,
      batch-capped at one, inside a single transaction's 120s cumulative
      budget. So the orchestrator runs two ways and the operator picks per run.


      DELEGATED (the default, and the one that works). The Agent Script issues
      ONE Apex callout to the bridge's `fanout:supplier-disruption` route. The
      bridge runs all three legs CONCURRENTLY off-platform — the same
      `orchestration.dispatch` the Managed Agents variant's host tool runs — and
      returns the three rendered sections plus a coverage line. The orchestrator
      only synthesises. The parallelism lives off-platform because Agentforce
      cannot do it on-platform; moving the fan-out to the bridge is how a
      serial-outbound platform still fans out.


      SERIAL (the constraint demo). The Agent Script calls its per-leg action
      three times, once per business unit, each a ~110s Apex callout. Two legs
      already threaten the 120s cumulative callout budget; three overrun it. A
      real three-leg run therefore DEGRADES — a later leg is abandoned mid-turn,
      which on Agentforce means HTTP 200 with the section heading present and
      the content silently gone (the exact failure the lab measured on
      2026-07-25). The partial-failure contract makes that visible rather than
      letting a degraded run read as complete.


      SYNC OR ASYNC — BY PROXY ONLY (WS11). The DELEGATED fan-out can call each
      leg the blocking way or with A2A's fire-then-poll lifecycle, but Agentforce
      never runs that loop: it cannot poll, because its only GA outbound is one
      serial Apex callout. So the async loop runs at the BRIDGE, on the
      orchestrator's behalf, during the single callout Apex holds open — the
      SAME orchestration.dispatch the Claude host tool runs. Agentforce never
      sees a task id; the bound is that ~110s callout, not any API gateway
      ceiling (the bridge is a long-lived service, not a Lambda). This is the
      honest shape of the third controller: a serial-outbound platform can take
      the asynchronous half of A2A, but only one layer down, never itself. The
      mode rides the situation as a routing block because the Apex body carries
      no field for it; a stripped or absent block degrades to sync, never to an
      error.


      WHAT IT MEASURES. That a platform whose only outbound is serial can still
      participate in a 1:many topology — by delegating the parallelism to a
      seam that has it — and exactly what the on-platform serial path costs when
      it tries to do the fan-out itself. Three orchestrators, one axis: host,
      graph, serial-Apex.


      THE CLAIM IT SUPPORTS. An enterprise does not need one agent platform. It
      needs one protocol and an honest account of what crossing platform
      boundaries costs — here, the cost of orchestrating from a platform whose
      native outbound cannot fan out at all.
    note: >
      Delegated is the default because it is the topology that completes; serial
      is selectable as the constraint demo and is EXPECTED to report legs as
      unavailable on a full three-leg run. Partial-failure policy is the same as
      the other two variants: a leg that fails is REPORTED, never omitted, and
      every run carries a coverage line. The orchestrator is authored in Agent
      Script (D14) and published to the production org with
      `sf agent validate|publish|activate`; the fan-out reuses the existing
      A2ALabInvokeRemoteAgent invocable — no new Apex, no new Named Credential.
      See D61 and plan/07-workstreams.md WS8.
    flow:
      - source: agentforce-client
        target: agentforce
        protocol: agentforce-api
        detail: >-
          You talk to the Agentforce Supply Orchestrator over the GA Agent API
          (session + message). Its orchestrator topic owns the whole answer and
          decides — from the injected [A2A-LAB ROUTING] fanout-topology block —
          whether to fan out DELEGATED (one callout) or SERIAL (three).
      - source: agentforce
        target: agentforce-apex
        protocol: internal
        detail: >-
          DELEGATED path: the agent calls its A2ALab: Fan Out action ONCE. Apex
          posts to the bridge at target `fanout:supplier-disruption` — a single
          serial callout that asks the bridge to do the parallel work.
      - source: agentforce-apex
        target: bridge
        protocol: rest
        detail: >-
          The callout crosses the Named Credential + tunnel to the lab bridge.
          The bridge recognises the `fanout:` verb, stamps the D27 rider, and
          runs orchestration.dispatch — the SAME concurrent fan-out the Managed
          Agents host tool runs.
      - source: agentforce-orchestrator-via-bridge
        target: adk-logistics-a2a
        protocol: a2a
        detail: >-
          LEG 1 — Logistics BU on Agent Engine (Gemini). Dispatched CONCURRENTLY
          with legs 2 and 3 by the bridge; each leg is its own Hop under this
          run's trace id, D27 rider at depth 2.
      - source: agentforce-orchestrator-via-bridge
        target: foundry-commercial-a2a
        protocol: a2a
        detail: >-
          LEG 2 — Commercial/Legal BU on Microsoft Foundry, over its native
          inbound A2A.
      - source: agentforce-orchestrator-via-bridge
        target: openai-agentcore
        protocol: agentcore-http
        detail: >-
          LEG 3 — Customer operations BU on the OpenAI agent on Bedrock
          AgentCore (SigV4).
      - source: bridge
        target: agentforce
        protocol: rest
        detail: >-
          The bridge returns the three rendered sections plus a coverage line in
          one response. The orchestrator synthesises the brief on-platform,
          reporting any leg the fan-out marked unavailable as an explicit gap.
    agents:
      - title: "Orchestrator — Supply Orchestrator (Salesforce Agentforce)"
        target: agentforce-orchestrator-rest
        caption: >-
          Authored in Agent Script (D14) and reached over the GA Agent API.
          Agentforce publishes no native A2A card, so there is none to fetch —
          the fan-out happens off-platform at the bridge (D61).
      - title: "Logistics BU — exposure (Google ADK · Gemini)"
        target: adk-logistics-a2a
        caption: >-
          Fan-out leg 1. The Logistics unit's OWN Agent Engine deployment. Its
          A2A card is synthesized locally — Agent Engine's preview A2A surface
          serves no public card route, so the client pins the transport (D26).
      - title: "Commercial / Legal BU — contract & penalty position (Microsoft Foundry)"
        target: foundry-commercial-a2a
        caption: >-
          Fan-out leg 2. gpt-5-mini on Microsoft Foundry over its native inbound
          A2A (Entra-authed). Honest status: native.
      - title: "Customer operations BU — customer comms (OpenAI · Bedrock AgentCore)"
        target: openai-agentcore
        caption: >-
          Fan-out leg 3. The OpenAI agent on Bedrock AgentCore, reached over
          agentcore-http with SigV4 — not A2A, so it publishes no public agent
          card.
