# Trusted-advisor insights — the lab's distilled findings, published in the
# console's Insights section and exported to markdown for presentations
# (scripts/export_insights.py -> plan/08-insights.md).
#
# status legend — an evidence ladder by WHAT BACKS THE CLAIM, not a workflow
# (this key is mirrored in the console's Insights legend; keep them in step).
#
# WS20: the tier is a property of the ARTIFACT, not a label the author typed.
# This is the one convention worth borrowing from Anthropic's Claude Science
# workbench — a claim's evidence tier should be something you can TEST by
# re-running, not something a human asserted. It is a convention and a
# vocabulary, not a standard (nothing in Claude Science is a published spec).
# The rungs, defined by whether the backing artifact still resolves:
#   measured    names a recorded number AND a live artifact behind it — a run
#               id, a trace file, or a plan/*.md anchor that still exists and
#               (for a number) could be re-produced. Re-runnable, not just
#               written down. (e.g. a latency in plan/03-results.md)
#   observed    an artifact existed and was documented, but is no longer
#               reproducible — a beta endpoint moved, a credential rotated, a
#               trace was pruned. The behaviour happened and was written down;
#               you can no longer re-run it to the same number.
#   hypothesis  no backing artifact — reasoning the lab expects to hold and
#               intends to test (say where). A ref that no longer resolves
#               drops an entry to this rung; that demotion is mechanical, not a
#               judgment call (insights-audit auto-demotes — WS20).
#
# Each entry: headline (the claim), evidence (what the lab showed),
# advisory (the talking point you'd give a customer), refs (ADRs/docs).
#
# Legacy: `review: required` on older entries marked an insight for the
# console's in-app reviewer. The Approve / Request-changes CONTROLS are turned
# off (INSIGHT_REVIEW_CONTROLS = false in index.html), so there is no in-app
# way to clear a review — an entry marked `review: required` just shows a
# permanent "awaiting review" state chip. A new insight therefore does NOT
# take this key (it would only pin an uncleared chip), and insights-audit no
# longer treats an unmarked entry as an escaped sign-off. Existing keys are
# harmless; leave them until the review flow is either rewired or removed.

insights:
  - id: sync-delegation-works
    category: Delegation patterns
    status: measured
    headline: Synchronous agent-to-agent delegation is real and fast enough for conversational use
    evidence: >
      Cross-platform sync round trips measured live in both directions and
      across vendors: Agentforce→OpenAI 20.9s, OpenAI→Agentforce 20.1s (D25),
      Agentforce→Claude collaboration turns 27–36s — one agent farms out a
      subtask, waits, and folds the answer into its own reply.
    advisory: >
      Treat sync delegation as "ask a colleague a quick question," not
      "commission a report." It fits expert lookups and enrichment inside a
      conversation turn; anything deeper belongs in an async pattern.
    refs: [D15, D16, D25, plan/03-results.md]

  - id: timeout-budget-stack
    category: Delegation patterns
    # Re-opened for sign-off 2026-07-25: the headline number in this claim
    # changed (~60s -> measured ~85-90s) and the silent-abandonment finding is
    # new, so the lab should not keep publishing it unread.
    review: required
    status: measured
    headline: Every platform in a sync chain stacks its own timeout — the tightest link caps the whole chain
    evidence: >
      The lab's Path A budget stacks four ceilings: Agentforce action ~85-90s
      (MEASURED 2026-07-25, not the ~60s the lab engineered against for its
      first two weeks — a reported figure nobody had tested) → Apex callout 110s →
      bridge 45s → remote agent 100s. The delegated agent's thinking depth is
      governed by the smallest budget upstream, and one platform's retry can
      blow another's ceiling. The correction went the generous direction and
      still cost something: research depth had been tuned against a ceiling
      25s below the real one.

      When the ceiling IS hit, nothing on the wire says so — the Agent API
      returns 200 with its "External market research" heading filled by
      "temporarily unavailable", while the delegated agent's real answer
      arrives seconds later and is discarded, every abandoned turn still
      burning the full ~100s. The rule recurses: hosting the shim behind API
      Gateway added a hard 29s ceiling that an Agentforce account turn
      (~20-27s tail, D32) straddles. And third-party callers hit it harder
      (2026-07-22) — the lab's client retries onto a warmed session, but
      Microsoft Foundry's A2A tool does not, so a cold turn 500s straight into
      the calling agent. You control your retries; you don't control your
      callers'.
    advisory: >
      Before promising a sync UX, map the full timeout chain across every
      platform involved — then MEASURE the links you inherited rather than
      quoting them, because the one number the whole budget hangs on is
      usually the one that came from a doc. Keep delegated turns fast (small
      models, concise prompts, warm runtimes) or move the work async. And
      instrument the abandonment case specifically: a timeout that returns
      200 with a plausible paragraph is indistinguishable from success in
      logs, dashboards, and evals alike — you will only catch it by checking
      whether the delegated content is actually THERE. This is the first
      architecture-review question for any interop design.
    refs: [D28, D32, plan/01-architecture.md, plan/02-matrix.md, plan/03-results.md, plan/07-workstreams.md]

  - id: sync-vs-async-shape
    category: Delegation patterns
    status: measured
    headline: Async delegation doesn't just relax the clock — it changes where the answer lands
    evidence: >
      The async account-brief pipeline runs 69–127s unbounded (scheduled
      managed-agent sessions) and delivers into CRM records consumed later in
      Salesforce, instead of into a waiting HTTP response. Same platforms,
      same protocols — different integration shape entirely.
    advisory: >
      Choose the pattern by asking who consumes the answer: a human waiting in
      a conversation (sync) or a business record/workflow (async). Async
      removes the timeout ceiling, adds delivery, retry, and dedup design —
      most enterprises need both patterns, deliberately.
    refs: [D16, D17]

  - id: a2a-session-semantics
    category: Protocols
    status: observed
    headline: Of REST, MCP, and A2A, only A2A carries conversation identity as a first-class wire concept
    evidence: >
      Running the same scenario over all three protocols: REST carries the
      session as a body field the lab defined itself (only trace correlation
      rides a custom header), MCP smuggles it as a tool argument (the
      protocol has no session semantics for this), while A2A's contextId is
      part of the protocol itself — the one place conversation identity
      needed no lab convention.
    advisory: >
      For one-shot delegation the protocol choice matters less than auth and
      observability. For durable multi-turn relationships between agents —
      especially across organizations — A2A is architecturally ahead: session
      identity and agent identity live in the protocol, not in conventions.
    refs: [plan/02-matrix.md]

  - id: a2a-async-at-heart
    category: Protocols
    # Re-opened 2026-07-27 by the insights-audit sweep: this entry claimed the
    # D11 SSE demo had been exercised, which the trace archive does not back
    # (D11 scoped it; nothing ran it). Re-opened AGAIN 2026-07-28 by the same
    # sweep, for the opposite reason — it still said the lab drives A2A
    # synchronously with "no callback leg on the wire", which WS11/D47 made
    # false the day before. Materially rewritten twice, so required per D38.
    review: required
    status: measured
    headline: A2A is an async-capable protocol that almost everyone drives synchronously — and here the sync default was one unset client field
    evidence: >
      Every A2A exchange in the lab returns a Task object with an id, state
      machine, and artifacts. For months the lab drove that lifecycle
      synchronously and assumed the server was the reason; MEASURED 2026-07-27,
      it was not. The a2a-sdk already honours
      `configuration.return_immediately`, responding once the Task exists while
      a background task drains the queue — the lab had simply never set the
      field, and no server change was required.

      With it set, `submit()` returns in 13–29ms against adapter work of 2s,
      10s and 45s — flat while the work grows 22x — and the hosted Agentforce
      shim completed 31.1s of work behind API Gateway's 29s integration
      timeout, longest single request 1.18s. Vendor support for the async half
      is uneven and only measurement reveals it: Azure Foundry implements it,
      and Vertex AI Agent Engine does too — but its managed handler pins A2A
      **1.0** and reads a *missing* `A2A-Version` header as `0.3`, so it 400s
      every header-less poll. That first looked submit-only and read like an
      Agent Engine gap; MEASURED against the spec and the live endpoint
      (2026-08-11, WS11 item 12), the cause was ours — the a2a-sdk never sends
      that header on its own. Pinning `A2A-Version: 1.0` on the ADK targets
      makes fire-then-poll work end to end. Streaming stays genuinely unexercised — the servers
      advertise `AgentCapabilities(streaming=True)`, the client hard-codes
      `streaming=False`, and D11's SSE demo never ran.
    advisory: >
      Don't conflate the pattern with the protocol, and check your own client
      before you re-platform. A2A gives you a durable task you could hand off,
      poll, or subscribe to — but the blocking call is the one in every
      quickstart, so teams hit a gateway timeout and scope a migration to
      escape a ceiling that one configuration field would have dissolved. Then
      verify per platform rather than per specification: "MAY continue
      asynchronously" lets a conformant implementation block, and no agent card
      tells you which one you are talking to. Submit, compare the response time
      against the total, and you have your answer in a minute.
    refs: [D11, D16, D47, plan/01-architecture.md, plan/02-matrix.md, plan/03-results.md]

  - id: native-a2a-young
    category: Protocols
    status: measured
    headline: Platform-native A2A is real — and young; "speaks A2A" spans a maturity spectrum you must test end to end
    evidence: >
      The lab's first native×native A2A cell (2026-07-19) — a Gemini/ADK agent
      on Vertex AI Agent Engine's own A2A endpoint, called by the lab's generic
      a2a-sdk client, warm answers in 2.6s — worked, but the preview edges
      showed at once: the public agent-card route 404s (discovery broken), auth
      is cloud IAM rather than anything the card negotiates, and the surface is
      v1beta1 HTTP+JSON, not the JSON-RPC most examples assume. Version
      mismatch is the deeper gap: Google REQUIRES `a2a-version: 1.0` (omit it
      and the handler assumes 0.3 and rejects with VERSION_NOT_SUPPORTED),
      while Microsoft Foundry SPEAKS 0.3 — it rejects a pure 1.x card and sends
      0.3 JSON-RPC that a 1.x server answers with -32601, and neither
      negotiates.

      Interop across "the same protocol" therefore took the lab's dual-dialect
      card plus a 0.3↔1.x translation layer. The capstone (2026-07-23) was the
      CROSS-HYPERSCALER cell: GCP Gemini consulting Azure gpt-5-mini over both
      platforms' native A2A endpoints, 16.9s, no lab component in the
      cross-cloud leg. What made it possible was IDENTITY, not protocol — the
      GCP container holds an Entra service principal to mint Azure tokens,
      while the reverse direction is auth-blocked because Foundry connections
      cannot mint Google IAM tokens. Two clouds, one protocol, and cloud
      identity decides who may call whom; the agent card says nothing about any
      of it.
    advisory: >
      When a platform claims A2A support, test the full story — discovery
      (card), transport negotiation, auth, session continuity — not just
      message exchange. Today's reality: message exchange works and is fast;
      discovery and card-declared auth are the immature edges, and cloud IAM
      sits outside the protocol entirely. Interop code needs escape hatches
      (pinned transports, locally-built cards) for exactly these gaps.
    refs: [D29, D30, plan/07-workstreams.md, plan/03-results.md]

  - id: protocol-reality-check
    category: Protocols
    status: observed
    headline: Native protocol support across enterprise platforms is sparser than the marketing suggests
    evidence: >
      The lab's honest matrix of inbound surfaces, platform by platform:
      Salesforce Agentforce is GA Agent API only (MCP is gated beta, A2A
      doesn't exist), so those cells run via lab shims and outbound is
      REST-only; Anthropic Managed Agents is its own API only, so the lab
      serves both protocols itself in front of the agent it hosts (the
      "native" cells are native because the AGENT is ours); and OpenAI has no
      inbound endpoint of any kind, so the lab's servers are the only door to
      that agent.

      Only two platforms speak a protocol natively: Google Vertex AI Agent
      Engine (A2A, no MCP serving) and Microsoft Foundry, which became the
      second platform-native A2A endpoint (2026-07-22, Entra-only). Five
      platforms in, exactly two platform-native protocol endpoints exist —
      everything else is the lab's own plumbing.
    advisory: >
      Plan for bridges and adapters as permanent, first-class, observable
      components of an interop program — not temporary scaffolding. Ask every
      vendor "which protocols do you speak natively, in which direction, GA
      or beta?" and demand wire-level evidence.
    refs: [D8, D29, D30, plan/02-matrix.md, plan/03-results.md]

  - id: observability-fragmentation
    category: Observability
    status: observed
    headline: Cross-platform agent observability is radically uneven — federate agents and you own the audit trail
    evidence: >
      Harvested side by side, six platforms give six different answers to
      "what did my agent do?". Salesforce exposes the richest queryable
      telemetry (full SQL over sessions/steps/LLM calls, but requires Data
      Cloud); Anthropic exposes the deepest per-session detail (thinking and
      tool events, but no aggregation API and pagination-walk discovery only);
      and OpenAI's trace dashboard is write-only with no read API, so your own
      tracing is the system of record.

      Google's column (2026-07-20) is the inverse shape — no session/turn API
      on the preview A2A surface, but Cloud Monitoring hands over token counts
      per model AND the literal billing meters (vCPU/GiB-seconds), so the lab
      can estimate a daily dollar cost the rich-session platforms expose no
      surface for. Microsoft's (2026-07-23) is the field's best so far:
      connect App Insights and every run emits agent-semantic OpenTelemetry
      gen_ai spans over KQL — invoke_agent, chat (per-call tokens and full
      messages), execute_tool — and the response id doubles as the lab's
      platform_ref, joining platform-interior spans to wire traces with no
      extra plumbing.

      AWS Strands (2026-08-04, D67/WS5) is a sixth shape again: no vendor
      session API at all, so it is observed only through its HOST cloud —
      CloudWatch/Bedrock meters — with a null platform_ref and a runtime-level
      rollup rather than a per-turn trail. Where you run the agent, not who
      built it, decides what you can see.
    advisory: >
      "Can you audit what your agents did across platforms?" is usually
      unanswerable today. Any multi-platform agent estate needs its own trace
      layer: a correlation id on every hop, raw payloads recorded, platform
      logs harvested where APIs exist. Budget for this on day one.
    refs: [D7, D18, D22, D31, D67, plan/05-observability.md, plan/07-workstreams.md]

  - id: managed-vs-self-hosted
    category: Hosting models
    # Re-opened 2026-07-28 by the insights-audit sweep: this entry published
    # the pre-measurement ASSUMPTION of ~5-10s managed provisioning, which the
    # 2026-07-25 run refuted (~2s) — and refuted in the direction that
    # strengthens the entry's own argument. A changed measured claim, so
    # required per D38.
    review: required
    status: measured
    headline: "Managed agent runtime vs self-hosted framework is the real platform decision — model choice is downstream"
    evidence: >
      The lab runs the same Claude agent two ways — Anthropic Managed Agents
      (zero infra, host-side tools, ~2s provisioning: cold 5.2s p50 / warm
      3.2s, MEASURED 2026-07-25) and the self-hosted Agent SDK on Bedrock
      AgentCore (IAM-only data plane, credentials and telemetry yours) — with
      the OpenAI agent on the self-hosted path for a clean comparison. Cold
      starts dominate the sync budget and the heavier harness pays more: on
      AgentCore, OpenAI cold ~31s / warm 10.3s, Claude cold ~56s (can blow a
      65s client timeout) / warm 8.4s; Vertex AI Agent Engine cold ~34s / warm
      2.6s. WS3 (2026-07-23) showed "serverless" splits in two — container
      runtimes (AgentCore, Agent Engine) trade idle cost for cold starts,
      while token-serverless prompt platforms (Foundry, Managed Agents) have
      no runtime to wake (Foundry cold ≈ warm, 10–17s).

      The fork shows up in tool governance too (2026-07-21): the same Claude
      agent answered cleanly on Managed Agents (its sandbox runs tools under
      the platform's policy) but stalled self-hosted, where the Agent SDK's
      permission-gated built-in tools made the model hit the WebSearch
      permission wall and ask the caller for access instead of answering.
      Self-hosting means owning the permission model, not just the
      infrastructure.
    advisory: >
      Managed runtimes buy speed-to-value and push security posture to the
      vendor; self-hosting buys VPC/data-residency control and portability at
      the cost of owning scaling, secrets, observability — and the agent's
      tool permission model, which will surface as behavior bugs, not config
      errors, if left on defaults. Decide this per agent — it's a bigger
      architectural fork than which frontier model runs inside.
    refs: [D9, D24, D26]

  - id: sdk-footprint
    category: Hosting models
    status: observed
    headline: '"Agent SDK" spans two very different species — thin API loops and full agent harnesses — with real deployment consequences'
    evidence: >
      Containerizing both self-hosted agents side by side: the OpenAI Agents
      SDK is a pure-Python library implementing its agent loop natively — an
      8-line Dockerfile. The Claude Agent SDK packages the entire Claude Code
      harness: the Python package is a client that spawns the Claude Code CLI
      (a Node runtime) as a subprocess, which owns the agentic loop, tool
      execution, MCP client, and session state. Same lab adapter on top;
      very different footprints underneath — measured on identical AgentCore
      runtimes: ~31s vs ~56s cold start; warm invokes comparable (p50 ~10.3s
      vs ~8.4s).
    advisory: >
      When customers compare "agent SDKs," make them ask what's actually in
      the box. A thin loop means a small image and full DIY on tooling; a
      harness means mature tool execution, MCP, and subagents for free — paid
      for in image size, cold start, and an extra process boundary. Neither is
      wrong; budget and architect for the one you picked.
    refs: [D24, D26, deploy/agentcore/]

  - id: credential-locality
    category: Security & trust
    # Extended 2026-07-25 with the DefaultAzureCredential finding.
    # WS20 demotion (2026-08-10, insights-audit actor-critic): measured -> observed.
    # The one figure this rested on — "Aurora held zero rows for two of five
    # platforms" — is a historical store state from a since-fixed incident (D39);
    # the endpoint/harvest was corrected, so the number no longer re-produces.
    # Behaviour documented and true; not reproducible to the same number now =
    # observed under the artifact-derived ladder.
    status: observed
    headline: Where partner credentials live is a design decision most agent architectures make by accident — and whose identity they resolve to is one nobody makes at all
    evidence: >
      Two patterns, deliberately contrasted: the managed path keeps Salesforce
      credentials host-side (the sandboxed agent calls a custom tool; secrets
      never enter the LLM runtime), while the self-hosted containers carry
      credentials in their runtime environment. Both work; the blast radius
      differs.

      The second half is sharper because the lab got it wrong for a week
      (2026-07-25): its Foundry harvest passed locally and failed hosted with
      InsufficientAccessError, and BOTH were correct — Azure's
      `DefaultAzureCredential` walked its chain to the developer's `az login`
      on the laptop and to the Lambda service principal that had never been
      granted `Log Analytics Reader`, so the local run was quietly proving a
      HUMAN had access. Every major cloud SDK ships this same ergonomic default
      and each dissolves "my laptop can reach this" into "the service can". Two
      findings rode along: the hosted harvest had never registered ADK or
      Foundry at all (Aurora held zero rows for two of five platforms while the
      local store looked complete), and an access denial that names no
      principal cost an hour re-checking a role already granted on an identity
      already verified.
    advisory: >
      Make credential locality explicit in every agent integration review —
      across trust boundaries, prefer broker/host-side tool patterns where the
      reasoning runtime never holds partner secrets, because an agent that can
      be prompt-injected should not also be an agent holding your partner's
      keys. Then ask the question most reviews skip: WHICH IDENTITY does this
      code authenticate as, and could a developer's own login satisfy it? Pick
      exactly one human login as the root of trust (the lab uses AWS SSO),
      make every other credential a service identity fetched with it from a
      managed secret, and construct cloud credentials EXPLICITLY — the
      convenience chains are appropriate for a CLI and actively harmful in a
      service, because they turn "unconfigured" into "works on my machine."
      A credential chain that can fall back to a person does not test
      production; it hides the gap until the code is somewhere a person is
      not.
    refs: [plan/01-architecture.md, D9]

  - id: emergent-topology
    category: Security & trust
    status: observed
    headline: Agent-to-agent graphs grow edges nobody drew — govern the actual topology, not the diagram
    evidence: >
      Mid-experiment, a shared Agentforce agent silently delegated to Claude
      while answering an OpenAI-originated request — turning a controlled
      two-platform test into a three-platform chain. Only the wire traces
      revealed it; the fix (D25) was dedicated per-platform twin agents so
      each experiment stays a closed system.
    advisory: >
      Once agents can call agents, delegation chains form transitively —
      including across billing, compliance, and data boundaries. Enforce
      closed systems per use case, and monitor real topology from traces.
      This governance problem arrives with your second platform, not your
      tenth.
    refs: [D25]

  - id: delegation-ttl
    category: Security & trust
    status: observed
    headline: Agent protocols have no TTL — bidirectional agent pairs loop by construction unless you build the guard yourself
    evidence: >
      Wiring both directions of each platform pair makes circular delegation
      possible by design — A delegates to B, whose tool delegates back to A —
      and without a guard, loops in the lab ended only by starvation (stacked
      timeouts and turn caps), surfacing as errors rather than clean stops.
      None of REST, MCP, or A2A carries hop-count/TTL semantics, though
      networking solved this decades ago (IP TTL, SIP Max-Forwards). The lab's
      fix is a convention: every delegated request carries a caller/depth rider
      with a do-not-call-back directive, and every seam refuses beyond a depth
      limit with a wire-visible message.

      The rider travels twice on purpose — as structured metadata AND as a text
      block — and the lab caught why the redundancy matters: one client
      silently dropped request metadata on the A2A hop, collapsing the shared
      shim's per-platform twin routing onto the default agent (a wrong-agent
      path found only in the wire traces). The text copy survived every hop; the
      shim now falls back to parsing it.
    advisory: >
      Ask any multi-agent architecture "what's your TTL?" If the answer is
      "the timeout," loops are being absorbed, not prevented — and each one
      burns tokens, latency, and platform quota until something starves.
      Until the protocols standardize hop semantics, enterprises must impose
      their own delegation-depth convention at every boundary they control,
      and prompt-level directives alone are hope, not enforcement — enforce
      at the seams. Carry the context in both the protocol's metadata and
      the message text: across heterogeneous hops, the text is the only
      channel every platform preserves.
    refs: [D25, D27, D28]

  - id: fabricated-attribution
    category: Security & trust
    # Marked for sign-off 2026-07-28 by the insights-audit sweep: the entry had
    # no `review:` key at all, yet it had grown the ~50%-under-hard-rules
    # finding and the tool_choice fix since it was first written. A materially
    # changed claim the lab would say in public, so required per D38.
    review: required
    status: measured
    headline: When a delegated tool call fails, a model may invent the other agent's answer — attribution and all
    evidence: >
      Measured live (2026-07-22, WS3): the Foundry agent's A2A call to
      Agentforce timed out behind an API gateway, and gpt-5-mini responded by
      FABRICATING a complete CRM summary — invented opportunities, amounts,
      account owner and an "At Risk" flag — under the attribution "From the CRM
      (via Agentforce)". Only the wire traces (zero Agent API hops) exposed it.
      An explicit "never invent CRM facts; if the tool fails, say so"
      instruction helped but proved PROBABILISTIC: with maximally hard rules
      the model still fabricated attributed data in roughly half of
      tool-failure runs, including narrating lookups it never made.

      What actually stabilized the cell was making the tool call SUCCEED — a
      use-the-tool nudge plus a client-side retry absorbing the cold-start
      failure; a completed call beats any instruction about failed ones. The
      flip side measured too: under default tool_choice the model SKIPPED the
      required delegation about half the time, either refusing honestly without
      calling or role-playing a query it never sent. Delegation reliability is a
      model behavior end to end — whether the call is made, and what happens
      when it fails.
    advisory: >
      Cross-agent attribution is a model behavior, not a protocol
      guarantee: nothing in REST, MCP, or A2A ties "according to agent X"
      to an actual successful exchange with agent X. Treat attributed
      delegation like any other claim needing evidence — instruct agents
      explicitly to fail honestly, and keep independent wire-level traces
      so fabricated attributions are detectable. This is the strongest
      argument yet that the audit trail must live OUTSIDE the agents.
    refs: [D27, plan/07-workstreams.md]

  - id: platform-not-model
    category: Federation vs consolidation
    status: observed
    headline: Delegating to a remote agent is not the same as calling a different model — platforms carry capabilities, models don't
    evidence: >
      The lab's Agentforce twin answers from live CRM data through governed
      Apex actions; the Claude and OpenAI researchers bring their own
      runtimes (and, for Claude, its own research tools). The inference
      follows: swapping which model an Agentforce action calls could not
      reproduce these experiments — the delegation is to capabilities
      plus data access, not to a text generator.
    advisory: >
      Cut through the "one platform, many models" pitch with one question: is
      this use case satisfied by a different model behind the same tools and
      data, or does it need capabilities and data another platform owns? The
      first is consolidation (simpler — take it when you can); the second is
      federation, and no model picker makes it go away.
    refs: [D12, D15, D16, D24]

  - id: when-to-federate
    category: Federation vs consolidation
    status: hypothesis
    headline: Federation is driven by ownership boundaries, not technology preference
    evidence: >
      The lab's framing (advisory reasoning, not a measured finding): the
      drivers that hold up in practice are different business units or
      partners already owning different agent stacks; vendor SaaS
      increasingly shipping embedded agents you don't control; a
      best-of-breed capability living off-platform; M&A merging estates.
      Where one trust domain and one data estate cover the use cases,
      consolidation stays simpler — the lab exists to make both paths
      concrete (WS3 was chartered as the consolidation-pitch counterweight).
    advisory: >
      Advise customers to consolidate within a trust domain and federate
      across trust domains — and to treat "we'll never need interop" with
      suspicion: your vendors are already shipping agents, so the second
      platform usually arrives whether you chose it or not.
    refs: [plan/07-workstreams.md]

  - id: honest-demos
    category: Method
    status: observed
    headline: Interop claims deserve wire-level evidence — insist that demos enter through the real platform agent
    evidence: >
      Lab rule D15: every experiment enters through the actual platform agent
      (a real Agentforce conversation, a real managed session) — no console
      simulation of a platform leg — and every hop records its raw wire
      payload. The rule has caught more architectural truth than any feature
      matrix, including the emergent-topology incident.
    advisory: >
      When evaluating vendor interop claims, require the demo to start inside
      the real product surface and show the wire. "Our platform speaks A2A"
      and "a slide says our platform speaks A2A" are different facts.
    refs: [D7, D15]

  - id: interop-tax
    category: Federation vs consolidation
    status: hypothesis
    headline: Every cross-platform hop levies a tax — latency, tokens, and an observability seam — that consolidation avoids
    evidence: >
      Qualitatively visible in every trace: each hop adds transport latency,
      re-contextualization tokens (the calling agent restates the task; the
      answering agent's context is rebuilt), and one more seam where telemetry
      fragments. Quantified lanes (per-hop token and cost accounting) are the
      M11.4 measurement workstream.
    advisory: >
      Federation isn't free even when it's right. Price the interop tax into
      the business case: if a delegation crosses platforms mainly for
      organizational convenience, consolidation may pay for itself in latency
      and cost alone. Numbers to follow from the lab.
    refs: [plan/05-observability.md]

  - id: rider-provenance
    category: Observability
    status: measured
    headline: A caller-identity rider makes remote platforms' own logs attribute who really asked — provenance you get without any platform cooperation
    evidence: >
      Every delegated request carries a plain-text rider naming the calling
      agent and platform (the D27 guard). Because it rides inside the message
      text, it lands verbatim in the RECEIVING platform's own execution logs —
      no integration, agreement, or platform feature required.

      Harvested across five platforms (2026-07-23, plan/03-results.md): 62 of
      220 platform-logged sessions self-attribute their caller (58 in
      Salesforce's session logs, where the rider appears in 188 events; 4 in
      Anthropic's) — the ones that were delegated turns rather than direct. The
      console surfaces this as a first-class "caller agent" column over logs
      the lab never wrote.
    advisory: >
      In a multi-vendor agent estate, assume the remote platform's audit
      trail will say a generic integration user asked — unless your requests
      say otherwise. A caller-identity convention in the message text is the
      cheapest provenance mechanism that exists: it needs no partner
      cooperation and it survives every hop, because the message text is the
      one channel every platform preserves and logs.
    refs: [D27, D34, plan/03-results.md]

  - id: text-trace-linkage
    category: Observability
    status: observed
    headline: A trace id carried in the message text links each platform's private logs back to the exact cross-platform run that caused them
    evidence: >
      Protocol-level correlation dies at platform boundaries — a lab A2A client
      silently discarded request metadata (the D28 incident), and no platform
      copies a foreign REST correlation header into its own logs. So the lab
      extended the delegation rider with a `lab-trace:` line carrying the
      originating run's trace id as message text (D34): every seam stamps it —
      Python, the Apex invocable, even the GCP-hosted ADK agent calling Azure —
      and the harvester regex-extracts it from whatever shape each platform's
      logs take. Pick a lab experiment and see the private execution logs it
      left inside Salesforce and Anthropic, joined by a value that traveled
      only as words in the prompt (9 sessions linked as of 2026-07-24, 8
      Salesforce and 1 Anthropic).

      Two honest limits, both about what text CANNOT reach. A platform whose
      agent identity is a static prompt (Foundry's) can identify itself but
      cannot carry a per-run id outbound; and Foundry's harvested rows are
      Azure Monitor span metadata (timings, tokens, operation ids, no prompt
      text), so there is nothing for the regex to match and that column joins
      by response id (platform_ref) instead. A text convention only works where
      the platform logs the text.
    advisory: >
      Distributed tracing for agent estates won't come from the protocols
      soon — none of REST, MCP, or A2A propagates a correlation id
      end-to-end today, and platforms drop what they don't understand. Put
      the correlation id in the message text as a convention and harvest it
      back out of each platform's logs. It's inelegant and it works — and
      it's the only mechanism the lab found that survives every seam,
      including ones you don't operate. Then check, per platform, whether
      the logs you get back actually contain text: where a platform emits
      span metadata only, plan a second join key (a response or operation
      id) before you promise a single pane of glass.
    refs: [D27, D34, plan/03-results.md]

  - id: antipattern-lens
    category: Method
    review: required
    status: observed
    headline: Production anti-pattern guidance assumes surfaces that cross-platform reality doesn't have yet
    evidence: >
      Scoring 34 single-vendor anti-pattern claims against the lab's
      five-platform evidence (D37): most hold, and several are confirmed by the
      lab's own measurements — runaway delegation loops, sync patterns on
      long-running work, reactive token refresh inside a timeout chain. But the
      claims that fail, fail in one direction: they assume structured, governed,
      negotiated surfaces exist end to end.

      Three measured counterexamples. "Use the hosted MCP server" — five
      platforms in, exactly two platform-native endpoints exist, both A2A and
      neither MCP; every MCP endpoint in the matrix is one the lab hosts itself.
      "Never regex-scrape text" — every structured channel failed somewhere
      (A2A metadata dropped by one client, headers and tool arguments reaching
      no platform's logs), while a text rider survived every hop. "Version your
      contracts" — both hyperscalers version their A2A dialects and neither
      negotiates, so interop still required a translation layer the lab had to
      own.
    advisory: >
      Read single-vendor best-practice decks as a target state, not a
      current-state playbook. For every "use the platform's governed
      surface" rule, ask: does that surface exist, in GA, on every platform
      in my estate, in the direction I need? Where it doesn't, the
      disciplined move is the labeled workaround — honest status, armed
      migration trigger — not abstinence.
    refs: [D37, plan/02-matrix.md, D27, D28, D34]

  - id: remediation-tax
    category: Federation vs consolidation
    review: required
    status: measured
    headline: Security remediations are intermediaries too — each one levies the same timeout and cold-start tax as any other hop
    evidence: >
      Security remediations levy the same taxes as any other hop. The lab
      hosted its Agentforce shim behind an API gateway (textbook "don't expose
      a raw wrapper"), and the gateway's hard 29s ceiling straddled the twin's
      first account turn (~20–27s, D32) — a non-retrying caller (Foundry's A2A
      tool) 500'd straight into the calling agent. Per-user session isolation
      (the remediation for shared warm sessions) multiplies exposure to the
      measured 31–56s container cold starts that platform-keyed warm pools
      absorb.

      A different tax showed up when the lab remediated itself (D37): of eight
      self-audited debts, the six that were code were hours of ordinary work,
      and the two assumed expensive — org-side identity work "no script owns" —
      turned out to be source-controlled metadata that shipped the same evening
      once somebody checked. But the identity split still cost a second day for
      a reason nobody predicted: the apps were configured and credentialled
      correctly and still 404'd, because an undocumented flag (JWT-based access
      tokens) must be on before the Agent API will serve a hand-built app. The
      irreducible manual step is one per app — a consumer secret no API will
      hand back, read from Setup by hand.
    advisory: >
      Price remediations like hops: every gateway, broker, or isolation
      boundary added for security contributes its own timeout, latency, and
      cold-start economics to the chain — budget the stack with the
      remediation IN it before promising a sync UX. And before you defer a
      hardening item as "that's platform config, not code," check whether
      the platform exposes it as metadata — the lab deferred two fixes on
      exactly that assumption and lost more time to the assumption than the
      fixes cost. The genuinely irreducible work is narrower than it looks,
      and usually it is a secret a human has to read with their own eyes.
    refs: [D37, D28, D32, plan/02-matrix.md, plan/03-results.md]

  - id: text-rider-legitimacy
    category: Protocols
    review: required
    status: observed
    headline: '"Never scrape text" is single-platform advice — cross-platform, a versioned text rider is a contract, not a hack'
    evidence: >
      Against platform APIs the lab parses structure only — typed message
      filters, JSON deserialization, never prose scraping. But for
      cross-platform correlation the structured channels all failed in
      practice: A2A metadata was silently dropped by one client mid-chain
      (D28), and no platform propagates a foreign header or tool argument into
      its own logs, so neither survives to where the correlation is needed. The
      delimited [A2A-LAB DELEGATION] rider in message text survived every seam
      and lands verbatim in remote platforms' logs.

      The distinction that matters is not text versus structure — it is
      arbitrary prose versus a delimited, versioned grammar. The lab made that
      explicit rather than implied (F7/D37): a `rider-version:` line, fixed
      keys, and a documented rule that parsers must tolerate unknown lines,
      which is what lets the grammar grow.
    advisory: >
      Split the rule instead of repeating it. Scraping identifiers out of
      free-form model prose is fragile and deserves the condemnation;
      carrying a small, delimited, versioned convention in message text is
      currently the only transport every platform preserves. If you ship
      one, treat it as a spec — fixed grammar, version line, documented
      tolerance for unknown keys — and parse it like one.
    refs: [D27, D34, D37]

  - id: versioning-not-negotiation
    category: Protocols
    review: required
    status: observed
    headline: Contract versioning is necessary and insufficient — shipped dialects don't negotiate, so budget for a translation layer you own
    evidence: >
      Both hyperscalers version their A2A surfaces; neither negotiates.
      Google's Agent Engine hard-requires `a2a-version: 1.0` — omit the
      header and the handler assumes 0.3 and rejects the call with
      VERSION_NOT_SUPPORTED. Microsoft Foundry speaks the 0.3 dialect and
      rejects a pure 1.x agent card, while a 1.x server answers its calls
      with -32601. Interop across what is nominally "the same protocol"
      took the lab's dual-dialect agent card plus a 0.3↔1.x translation
      middleware at the shim (`interop/servers/a2a_compat.py`).
    advisory: >
      Version every tool and agent contract you publish — and still assume
      the counterparty ships a different generation with no negotiation
      path between you. A translation seam you own is part of the real
      interop architecture, not a temporary shim, and it should be staffed
      and tested like one.
    refs: [D29, D30, plan/07-workstreams.md]

  - id: least-privilege-is-identity
    category: Security & trust
    review: required
    status: observed
    headline: Least privilege in an agent estate is an identity-modelling problem wearing a scope-configuration costume
    evidence: >
      The lab ran one shared Salesforce External Client App for every caller —
      two agent runtimes, a protocol shim, the observability harvest — and its
      grant (`api, refresh_token, chatbot_api, sfap_api`) looked like sloppy
      over-permissioning. Auditing it caller by caller showed why trimming
      fails: the grant was the UNION of four callers' needs, so every scope was
      load-bearing for somebody. `refresh_token` was genuinely dead and dropped
      for free, but `api` was needed by exactly one caller (the harvest reading
      Data Cloud DMOs). The fix was not a shorter list but four apps — three
      agent callers holding only `chatbot_api, sfap_api` and the harvest holding
      `api` alone — verified from the org by `scripts/identity_preflight.py`,
      which is a positive check (each identity sufficient, not proven minimal).

      One shared app had also made every caller look like one integration user
      in the org's audit trail — the same modelling error as an observability
      failure. The split itself was cheap (deployable metadata, no code, each
      seam already had its own secrets store), but an undocumented prerequisite
      cost a day: every new app authenticated and every Agent API call 404'd,
      because a hand-built External Client App must also enable JWT-based access
      tokens (`isNamedUserJwtEnabled`) — a flag absent from the scope list,
      invisible in login history, and not what a 404 points at. Turning it on
      fixed it with the least-privilege scopes untouched.
    advisory: >
      When a shared integration app's scope list looks bloated, don't start
      by trimming it — enumerate the callers behind it first. A union grant
      is the arithmetic of shared identity, and you cannot shrink it without
      splitting the identity, because every scope on it is genuinely needed
      by someone. Budget the split as the real remediation: one app per
      caller, each scoped to what that caller actually calls. You get least
      privilege and per-caller attribution from the same change — and the
      attribution is often the part the auditors were really asking for.
    refs: [D37, plan/04-runbooks.md, plan/02-matrix.md]

  - id: observed-via-host-cloud-meters
    category: Observability
    status: observed
    headline: When a platform ships no observability API, its host cloud's own meters are the audit trail — you observe the substrate, not the agent
    evidence: >
      Strands is the lab's sixth Observability column and the first observed
      purely through the HOST CLOUD's meters rather than an agent-platform API
      (D67). Claude and OpenAI also run on Bedrock AgentCore, but the lab reads
      them through their vendor session APIs (Anthropic Managed Agents, OpenAI
      Responses) — the AgentCore hosting is invisible to the obs layer. Strands
      has no vendor session API at all, so `strands_source.py` reads the two
      surfaces AWS exposes about anything running there: `AWS/Bedrock` model
      metrics (InputTokenCount / OutputTokenCount / Invocations /
      InvocationLatency per ModelId) for tokens and cost, and the AgentCore
      runtime access log (POST /invocations lines) for invocation and error
      counts — both over boto3, signed by the one human AWS login (D39), no new
      credential. First live harvest (2026-08-05, recorded in D67): one runtime
      obs session carrying 6 ok / 0 error invocations and ~11.7k tokens (≈ $0.02
      est.). Two honest limits travel with the numbers: the Bedrock meters are
      per-ModelId and account-wide (they attribute to Strands cleanly only
      because it is this account's only Bedrock-backed agent), and the Bedrock
      request-id (platform_ref) is null at this SDK version, so the obs session
      binds to the RUNTIME, not to individual lab traces — a daily rollup per
      runtime, like ADK's Agent Engine column, not one row per turn.
    advisory: >
      Before promising a single pane of glass over a multi-platform agent
      estate, ask per platform: does it expose an observability API at all? For
      the ones that don't, you are not blocked — you fall back to the host
      cloud's own meters (billing, model-invocation, and access logs), which
      exist for anything running there. But price the downgrade honestly: cloud
      meters are keyed by infrastructure (model id, runtime, account), not by
      your business trace, so you get cost and volume but usually not turn-level
      detail or a join back to the specific cross-platform run. Plan a second
      correlation key, or accept a runtime-level rollup, before you promise
      per-trace attribution.
    refs: [D67, D66, D39, plan/05-observability.md]

  - id: mode-remap-cannot-cross-protocols
    category: Hosting models
    status: observed
    headline: A deployment-mode switch can move an agent to its hosted twin, but it cannot move it onto a runtime that speaks a different protocol
    evidence: >
      The lab flips one env var (A2ALAB_MODE=hosted) to resolve every local
      target to its hosted twin — the local↔hosted dev switch (D26). D55
      constrained that remap to addresses only: a mode entry may change WHERE a
      target lives, never its backend, platform, or protocol. Building the
      reverse Strands experiment (Agentforce → Strands) surfaced the corollary
      (D68): reaching a Bedrock AgentCore runtime from a bridge-delegated REST
      target would require remapping rest → agentcore-http — a PROTOCOL change,
      which the rule forbids. So no value of A2ALAB_MODE can route a delegation
      onto an AgentCore runtime. A cell that must exercise the runtime's IAM
      invoke_agent_runtime seam has to NAME a target that already resolves there
      (strands-agentcore), independent of mode. The stale cell that assumed
      otherwise (agentforce-to-claude-aws, whose text still described a remap D55
      had deleted) proved the failure mode: it silently landed on the managed
      faces backend — two cells describing one thing.
    advisory: >
      A "same code, hosted or local" switch is only honest within one protocol.
      The moment your hosted twin speaks a different wire protocol than its local
      original — a container runtime with an IAM data plane instead of an HTTP
      face — an environment flag can no longer be the thing that reaches it,
      because you would be changing the contract, not the address. Make the
      target that must hit the special runtime name it explicitly, and keep the
      mode switch for like-for-like address swaps. And audit every consumer of a
      remap you remove: the drift here outlived the fix by two months because it
      leaned on scenario prose nobody re-read.
    refs: [D68, D55, D26, D66]

  - id: runtime-constant-framework-variable
    category: Hosting models
    status: observed
    headline: A container agent-runtime is framework-agnostic — the SDK inside is the variable, the host is the constant
    evidence: >
      The lab now runs three different agent frameworks on the identical Bedrock
      AgentCore substrate: the Claude Agent SDK, the OpenAI Agents SDK (D24/D26),
      and the Strands SDK (D66) — each a different Dockerfile and agent loop, all
      behind the same IAM-only invoke_agent_runtime data plane and the same lab
      AgentAdapter seam. Nothing in the runtime knows or cares which SDK it
      hosts; the container contract (build an image, expose /invocations, sign
      with SigV4) is constant across all three. The differences are all INSIDE
      the box — footprint and cold start (an 8-line OpenAI image vs the Claude
      harness's Node subprocess, ~31s vs ~56s cold on identical runtimes) — not
      in how the platform hosts them. Adding Strands as the third was a new
      backend and a new target, and touched nothing in the runtime layer.
    advisory: >
      Separate two decisions customers routinely conflate: which agent runtime
      hosts the container, and which agent framework runs inside it. A generic
      container runtime (AgentCore, Cloud Run, a plain ECS task) commits you to
      an operational contract — build, deploy, authenticate, scale — and leaves
      the framework a swappable, portable choice; the reasoning stack is not
      wedded to the host. That portability is a real asset in a best-of-breed or
      hedge-your-vendor strategy, but it stops at the runtime boundary: a managed
      agent platform that owns both layers trades it away for speed-to-value.
      Know which of the two you are buying.
    refs: [D66, D24, D26]

  - id: orchestration-topology
    category: Orchestration topology
    # Status flipped to `measured` 2026-07-28 by the insights-audit sweep: this
    # comment still said "not yet measured — the platform agents are not
    # deployed", but WS8 recorded live runs on 2026-07-25 and 2026-07-26 (3/3
    # legs, 37.4s wall, trace 9024af03…) and the four-platform join rate was
    # measured at 1 of 4. Both preconditions it named were already satisfied.
    review: required
    # Upgraded hypothesis -> observed 2026-07-25: the first live dispatch ran
    # (ADK + Foundry in parallel, openai leg genuinely dead). Not yet `measured`
    # — the four-platform join rate, the number this insight is really about,
    # needs all legs deployed and a harvest.
    status: observed
    headline: Fan-out is where cross-platform observability stops being a slogan
    evidence: >
      MEASURED 2026-07-25, first live dispatch: two legs in parallel (Gemini on
      Agent Engine, gpt-5-mini on Foundry) finished in 36.7s against a 50.7s
      serial equivalent, while a genuinely dead third leg (expired AWS
      credentials) rendered inline as "[leg unavailable: openai — ...]" with a
      "2/3 legs answered" line and a non-zero exit. It also surfaced a
      successful-looking-but-useless response — the Gemini leg once replied with
      a clarifying question, HTTP 200 and structurally perfect, the second such
      case the lab has measured (the first being an Agentforce action returning
      its section heading with the content silently gone). The fan-out join rate
      was the real deliverable, measured 2026-07-26 at **1 of 4, not the 3 of 4
      this entry originally predicted** — predicting then measuring is the
      point; publishing the prediction as the result is not.

      Fan-out is where the 1:1 cells (twelve of the lab's first thirteen
      scenarios) stop generalizing: it stresses the delegation guard under
      parallel dispatch (depth-1 three times, not a chain), spans four
      platforms' logs each with its own join key, and makes partial failure the
      normal case rather than the edge. The scenario is now built THREE ways on
      one axis — who owns the concurrency: a HOST tool on Managed Agents, a
      declared graph (ParallelAgent) on ADK, and (2026-07-30, D61) an Agentforce
      orchestrator whose only GA outbound is a SERIAL Apex callout, so it
      DELEGATES the fan-out to the bridge's route off-platform. A serial-outbound
      platform participates in a 1:many topology only by handing the parallelism
      to a seam that has it.
    advisory: >
      Before promising multi-agent orchestration, ask what the system does
      when one agent of several does not answer — and check that the answer is
      not "produce a shorter report and call it success". Partial failure is
      the default state of any fan-out, so make it structural: every branch
      gets a section in the output whether or not it succeeded, and every
      result carries a coverage count. A degraded run that reads like a
      complete one is worse than an error, because nothing downstream — logs,
      dashboards, evals, or the human reading the summary — can tell the
      difference. Then verify you can still trace one logical task across
      every platform it touched; if you cannot, you have bought orchestration
      and sold your observability to pay for it.
    refs: [D16, D27, D34, D61, plan/07-workstreams.md, plan/03-results.md]

  - id: cross-cloud-agent-identity
    category: Identity and trust
    review: required
    status: measured
    headline: >-
      An agent that leaves its own cloud needs an identity in the destination
      cloud — and that is a deploy problem, not a protocol one
    evidence: >-
      MEASURED 2026-07-26. The same orchestrator code, targets and prompts
      reached 3/3 business units from a laptop and 0/3 from a Vertex AI Agent
      Engine container — nothing about A2A changed, but the laptop held every
      credential and the container held one. Fixing it took three unrelated
      corrections, and the spread is the finding.

      Two legs failed because the container got each target's NAME but not the
      ${VAR} its endpoint expands from — an unset var expands to "" and an empty
      endpoint fails as a NETWORK error, sending you to debug connectivity for a
      manifest bug. The GCP-to-GCP leg 403'd because Agent Engine runs as a
      Google-managed service agent that cannot query a sibling reasoning engine,
      so "same cloud" bought no permission. And the AWS leg needed federation
      because Bedrock AgentCore's data plane is SigV4-only with no bearer-token
      fallback, unlike the Azure and Google legs. After the fixes: 3/3 legs,
      16.8s wall, no long-lived credential in the container at all.
    advisory: >-
      When someone says their agents are "multi-cloud", ask which credential
      each hop presents and where it came from. The protocol conversation is
      usually settled long before anyone has answered that. Prefer federation
      to keys where the destination supports it — AWS trusts accounts.google.com
      natively, so a GCP container can mint its own short-lived AWS credentials
      with nothing to rotate. And budget for the fact that a cloud's own
      identity plane is where the transport choice gets made for you: the one
      leg with no HTTP option was the only one that required real identity work.
    refs:
      - D39
      - D40
      - plan/03-results.md
      - plan/07-workstreams.md

  - id: where-the-tool-runs-decides-who-orchestrates
    category: Orchestration topology
    review: required
    status: measured
    headline: >-
      "Agentic" is a property of the tool inventory, not the prompt — and moving
      a tool off the host buys autonomy at the price of a request budget
    evidence: >-
      MEASURED 2026-07-26, same agent and prompt, same three business-unit
      agents on three clouds, two tool topologies. With ONE host-side tool that
      fans out, the model's only decision is WHEN to call it — the order and
      parallelism are an asyncio.gather in our code, and the session cannot
      progress unless a laptop stays attached. With one REMOTE MCP tool per unit
      (executing on the vendor's orchestration layer), the model issued all
      three in a SINGLE turn on both runs (3/3 in 50.5s and 42.6s) with nothing
      attached. The prompt only says the units are independent; measuring
      per-TURN off the model-request boundary is what distinguishes three at
      once from three in a row.

      Two costs came with it. Coverage: the host-side tool appends
      "[coverage: n/3]" from code that knows the roster, and three independent
      tools have no such vantage — stating the roster in the prompt and asking
      the model to reconcile was enough (both runs reported "3 of 3" unprompted,
      one flagging a unit's terms as assumptions). And latency, not optional:
      the units now run inside an HTTP request/response and inherit the
      gateway's 29s timeout (25s per unit against 120s host-side), so warm units
      (1-13s) fit but a cold platform (31-56s cold start) reports unavailable.
    advisory: >-
      When a team says their system is agentic, ask what the model actually
      decides. If the tool inventory contains one "do_the_thing" tool, the
      answer is "when", and the sequencing lives in your code — that is a
      program with a language model in it, which is often the right design but
      should not be sold as autonomy. Decomposing into one tool per capability
      moves the scheduling decision to the model, and on this evidence the model
      takes it. Two things to check before you do. Whatever your aggregate tool
      computed for free — coverage counts, totals, cross-branch consistency —
      now has no owner, so state the expected set explicitly and verify the
      model reconciles against it in code, not in prose. And find out what
      execution budget the hosting layer imposes: a tool that ran on your own
      host had only your patience as a limit, while the same work behind a
      managed gateway inherits an HTTP timeout that no protocol document
      mentions and that cold starts will find first.
    refs:
      - D41
      - plan/03-results.md
      - plan/07-workstreams.md

  - id: errors-must-not-be-relayed-by-a-model
    category: Observability
    review: required
    status: measured
    headline: >-
      An LLM asked to relay an error paraphrases it — give failures a path out
      that does not pass through a model
    evidence: >-
      MEASURED 2026-07-26. The ADK orchestrator's partial-failure contract works
      as designed: each business-unit agent passes a "[leg unavailable: ...]"
      marker through verbatim, and the synthesiser reports it as a gap rather
      than inventing an answer. It faithfully did so — and rendered the raw
      AccessDenied that named the caller's own OIDC claims as "an
      InvalidConfigError related to its CA bundle configuration". Both are true;
      only the raw error is actionable, and it was the paraphrase — not the raw
      error — that reached a human.

      The paraphrase was all the human saw until the leg markers were also
      printed to container stdout, at which point the raw AccessDenied and its
      one-line fix were finally legible. Contrast the host-side variant, where
      the marker is produced by CODE and cannot be reworded.
    advisory: >-
      Any error you intend to debug from needs a route to your logs that skips
      the model. Structured relay through an agent is fine for the USER-facing
      summary and useless as telemetry — the paraphrase is lossy in exactly the
      direction that matters, dropping identifiers and keeping sentiment. This
      is also the sharpest argument for host-side tool execution: a contract
      enforced in code cannot be talked out of, whereas a declared graph buys
      ordering guarantees but still relies on three models relaying text
      faithfully.
    refs:
      - D40
      - D41
      - plan/03-results.md

  - id: telemetry-config-is-not-evidence
    category: Observability
    # New 2026-07-26 from the WS9 coding-agent telemetry work: the Claude Code
    # path is now proven at the destination and the Codex path is proven
    # broken. Unreviewed — needs sign-off before it goes in the deck.
    review: required
    status: measured
    headline: A telemetry config that parses is not evidence of telemetry — only a query at the destination is
    evidence: >-
      Two coding agents, one CloudWatch OTLP endpoint, one credential, the same
      afternoon (2026-07-26, 2-day window). Claude Code landed 28 series /
      119,754,973 tokens / 3 sessions, each carrying queryable @resource.tool,
      @resource.project, @resource.repo and @resource.team.id. Codex, launched
      through scripts/codex_otel.sh for a real session in the same window,
      landed exactly zero — three silent mismatches in one config line: Codex
      has three exporters (logs, traces, metrics; metrics defaults to statsig,
      NOT OTLP), and the lab had set `exporter` (logs) to the metrics endpoint
      with a metrics-only token and never set `metrics_exporter`. This was the
      third silent-zero in the subsystem, each looking like correct client
      config while logging nothing.

      RESOLVED 2026-07-27, and the fix sharpens the finding: with
      `metrics_exporter` set, Codex exports — but under names that were never
      going to match a mirror of Claude Code's schema (no `codex.cost.usage`; the
      live metrics are `codex.thread.started`, `codex.conversation.turn.count`
      and a `codex.turn.token_usage` histogram). So the first zero was a config
      bug and the second a naming assumption, and only a query at the
      destination could tell them apart. Both tools now attribute correctly
      (tool, project, repo) and label every datapoint with `model`.

      A third coding agent, Cursor, was wired in 2026-07-31 and made the point
      twice over. It ships NO native OTel exporter at all, so its metrics reach
      the same endpoint only through lifecycle hooks forwarded to the cursorscope
      ingestor, and its counters are CUMULATIVE, not the delta Sums the two
      native exporters emit — the harvest differences them with increase() where
      the others are summed, and using the wrong function is a silent
      order-of-magnitude error, not a rounding one. But the harvest showed
      nothing at first for two reasons a config file could never have surfaced,
      and only a destination query did: (1) the one metric that had actually
      landed was `cursor_hook_events_total`, which the first metric list omitted,
      so the reader queried a set of names that did not yet exist and skipped the
      one that did; and (2) cursorscope emits NONE of the @resource.tool / repo /
      project labels the two native exporters carry — it labels by service.name /
      service.namespace / deployment.environment instead — so even once the names
      matched, every Cursor row attributed to `unattributed` until the reader
      learned to fall back to those keys. With both fixed, the writer Lambda
      landed a `cursor:2026-07-31` row in Aurora and it surfaces as a `cursor`
      line item in the console. It honestly reads zero sessions: the only
      datapoints so far are the setup script's flush probe
      (`cursor_hook_name=debug.flush_test`), so a real session's counters are the
      last mile still pending — exactly the destination-query bar, one layer
      deeper than "does the config parse".
    advisory: >-
      Treat signal, endpoint, and credential as one unit, and never mark a
      telemetry path done on the strength of a config file or a helper that
      exits 0 — those prove the client tried, not that anything arrived. The
      acceptance test is a query at the destination that returns your own
      labels. Budget for the fact that per-tool telemetry is NOT symmetric:
      neither Claude Code nor Codex emits any built-in attribute naming the
      project, working directory or repository, so codebase attribution is
      always something you add — and the mechanism differs per tool (Claude
      Code takes it from a per-project settings file, while Codex ignores
      `otel` in project-local config entirely and needs a launch wrapper).
      Assume nothing carries over from one agent's setup to another's — the
      third agent added to this lab, Cursor, had no native exporter to configure
      at all and reaches the endpoint only through a hook-forwarding ingestor.
      Check what is already built in before configuring anything, because the
      split is not intuitive: the native tools label every datapoint with the
      `model` that ran it, unconfigured (verified 2026-07-27 — claude-opus-5 and
      claude-haiku-4-5 on Claude Code's cost and token metrics, gpt-5.6-sol on
      all three Codex metrics), so WHAT ran is free while WHERE it ran is not.
      And confirm the temporality before writing the read query: Claude Code and
      Codex export delta Sums, Cursor's cursorscope counters are cumulative, and
      summing a cumulative counter over-counts by the running total at every
      step.
      And
      once it is flowing, review the attribution VALUES, not just their
      presence: resource attributes are unvalidated free text, so a repo left
      with the example placeholder does not error — it quietly becomes a second
      codebase in the rollup, and two plausible-looking bars are harder to
      notice than one missing one (seen 2026-07-27, `<owner>/aws-logging-service`
      beside the real repo).
    refs:
      - D39
      - build-notes/claude/08-coding-agent-telemetry.md
      - build-notes/cursor/01-coding-agent-telemetry.md
      - src/observability/coding_source.py
      - scripts/codex_otel.sh
      - scripts/cursor_otel.sh

  - id: input-tokens-is-not-the-input
    category: Observability
    # New 2026-07-27, found while adding the four token buckets to the WS9
    # telemetry dashboard (D44). Unreviewed — needs sign-off before the deck.
    review: required
    status: measured
    headline: A consumption number is only decision-grade when its label means what a reader assumes — `input_tokens` does not
    evidence: >-
      The Anthropic API bills prompt tokens in three categories — uncached
      input, cache reads, cache writes — and `input_tokens` is only the UNCACHED
      REMAINDER, not the prompt. The lab's harvest had stored all four buckets
      since WS9, but the console's /api/build-telemetry endpoint returned two.
      MEASURED on one Claude Code day (2026-07-27): the dashboard rendered
      120,000 "input tokens" for a day that processed 4,420,000 prompt tokens —
      a 36x understatement, on exactly the workload shape (long sessions, heavy
      caching) the section exists to measure. Nothing errored and the number
      looked plausible.

      The buckets also do not bill alike — a cache read costs roughly a tenth of
      uncached input, a cache write 1.25x (5-min TTL) or 2x (1-hour) — so they
      cannot be summed into one figure and multiplied by a rate. Fixed with four
      tiles, a composition bar, and a note that travels in the API payload so no
      consumer can render the numbers without the reason they are separate.
    advisory: >-
      When you report consumption for a metered service, report it in the units
      the vendor BILLS, and check that each field means what its name implies
      before it reaches a dashboard — a wrong-but-plausible number raises no
      alert and can survive indefinitely. Then separate the two factors that
      multiply into cost, because only one of them is yours: units per unit of
      work is an engineering property (measurable, reproducible, improvable
      with caching and model choice, and it survives a price change), while
      price per unit is a contract (promotions, agreements, timing). Quoting
      their product commits you to something you do not control; quoting them
      separately makes both answerable. Say plainly where your own figure is
      soft — a client-side estimate at list price is not an invoice, and on a
      subscription it is not money that changed hands. The transferable
      artifact is not the dollar total but the DENOMINATOR: per-repo,
      per-model, per-tool attribution derived from your own telemetry rather
      than any vendor's billing export, which is the one thing no vendor gives
      you across vendors.
    refs:
      - D44
      - build-notes/claude/10-consumption-and-list-price.md
      - src/console/app.py
      - src/observability/coding_source.py

  - id: async-protocol-half-is-unused-not-missing
    category: Orchestration topology
    review: required
    status: measured
    headline: >-
      The API gateway timeout that bounds agent work is a client default, not a
      protocol limit — and the fix was one unset field
    evidence: >-
      MEASURED 2026-07-27. A2A specifies SendMessage MUST return immediately and
      processing MAY continue, and the lab had implemented that lifecycle
      (InMemoryTaskStore, full SUBMITTED → WORKING → COMPLETED) then driven it
      synchronously the whole time. The workstream that set out to fix it named the
      server as the blocker and was WRONG: the a2a-sdk already reads
      `configuration.return_immediately` and responds after the first Task event
      while a background task drains the queue, no server change made.

      Setting that one client field took the hosted Agentforce shim from work
      bounded by API Gateway's 29s timeout to 31.1s of work completed behind it,
      longest single request 1.18s — dissolving the ceiling D41 had costed a
      gateway migration to raise. Submit latency is flat at 13–29ms while work
      grows 2s→45s. Support looked uneven at first: Azure Foundry implemented the
      async half properly (ratio 0.25–0.33), while Vertex AI Agent Engine
      appeared submit-only — a task id in 826ms that no request shape read back.
      RE-MEASURED live 2026-08-11, that verdict was ALSO a client default: Agent
      Engine's managed handler pins protocol 1.0 and reads a missing
      `A2A-Version` header as 0.3, so the a2a-sdk's header-less `tasks/get` came
      back 400 "A2A version '0.3' is not supported by this handler". Pinning one
      client field — `A2A-Version: 1.0`, scoped per target — makes fire-then-poll
      work end-to-end there too. TWO apparent platform limits, both one unset
      client field.
    advisory: >-
      Before you re-platform to escape a timeout, check whether your client is
      using the asynchronous half of the protocol you already speak. Async task
      lifecycles are common in agent protocols and almost universally driven
      synchronously, because the blocking call is the one in the quickstart — so
      the ceiling teams hit is usually a default rather than a limit, and the
      migration they scope to fix it is usually unnecessary. Then verify support
      per platform rather than per specification: "MAY continue asynchronously"
      permits a conformant implementation to block, and nothing in an agent card
      tells you which one you are talking to. But when a platform SEEMS not to
      support the async half, suspect your client before the platform: the lab
      recorded Agent Engine as "submit-only" for two weeks when the real cause
      was a missing protocol-version header the SDK never sent. Read the error —
      a 400 "version not supported" is a header bug, not a capability gap. The
      measurement is cheap — submit, compare the response time against the total,
      and read the failures literally — and the answer changes your architecture.
    refs:
      - D47
      - D41
      - plan/03-results.md
      - plan/07-workstreams.md

  - id: async-needs-a-runtime-that-keeps-computing
    category: Orchestration topology
    review: required
    status: measured
    headline: >-
      Fire-then-poll dissolves the request ceiling but conjures no compute — on
      a scale-to-zero runtime, backing off starves the work you are waiting for
    evidence: >-
      MEASURED 2026-07-27 on the lab's hosted Agentforce A2A shim (Lambda behind
      API Gateway). Polled steadily, a 31.1s job completed in 21 polls with no
      request longer than 1.18s. Submitted and then left QUIET for 45 seconds —
      longer than the ~30s the work takes — the task was still WORKING on the
      first poll and completed only after 12 further polls at t+67.7s. Lambda
      freezes the execution environment when the response is sent, so the
      background consumer gets CPU only while an invocation is in flight: the
      polls are not observing the work, they are paying for it.

      Total wall-clock got WORSE with less polling, inverting ordinary polling
      advice. The same pattern against always-on hosts (Azure Foundry, the
      lab's Fargate bridge) progresses whether or not anyone is looking. A
      second limit rides along — the task lives in an in-memory store in one
      warm container, and nothing guarantees a later poll reaches that instance.
    advisory: >-
      Asynchronous protocols and serverless runtimes make a promise each that
      the other does not keep. The protocol says the work continues after the
      response; the runtime says compute stops when the response is sent. Where
      both are true you get a system that only advances while someone is
      watching it — worst-case behaviour for exactly the long-running jobs
      async was adopted for. Two questions settle it before you build: does the
      compute keep running between requests, and does the task survive the
      instance that created it? If either answer is no, put the agent on an
      always-on host or an explicit job runner and keep the async protocol for
      the client-facing seam, where its real benefit — no long-held connection —
      does not depend on the runtime at all.
    refs:
      - D47
      - plan/03-results.md
      - plan/09-deployment-map.md

  - id: behaviour-survives-content-off
    category: Observability
    # New 2026-07-30 from WS16 (D59): the behavioural log signal, enabled and
    # proven at the destination with content flags OFF. Unreviewed — needs
    # sign-off before the deck.
    review: required
    status: measured
    headline: >-
      A coding agent's telemetry is privacy-preserving by DEFAULT, not by
      redaction — the behavioural signal is metadata, and content-off costs it
      nothing
    evidence: >-
      Claude Code emits per-event OTLP logs — one record per tool call, API
      request and prompt — and the natural fear is that measuring behaviour
      means shipping prompts and file contents. MEASURED 2026-07-30, it does
      not: every field the five insight families need ships regardless of the
      content flags, which default OFF and were kept off. Edit-acceptance comes
      from `claude_code.tool_decision`, tool mix and per-tool latency from
      `claude_code.tool_result`, request latency from `api_request`, reliability
      from `api_error`/`api_refusal`, and prompt cadence from
      `claude_code.user_prompt` (`prompt_length` — a character COUNT, never the
      text). Content-off is not a degraded mode; the sensitive fields
      (`OTEL_LOG_USER_PROMPTS`, the `OTEL_LOG_TOOL_*` flags) are simply never
      turned on.

      The path was also the third confirmation that signal, endpoint and
      credential are one unit: the CloudWatch METRICS token 403s against
      logs.<region>/v1/logs, so logs need their own logs.amazonaws.com
      credential, a pre-provisioned log group with bearer auth, two undocumented
      x-aws-log-* headers, and a manually created stream — proven by an
      OTLP/JSON POST returning 200 and a SigV4 read-back matching a unique
      marker. Read-back is unusually the easy half: boto3's logs client signs
      FilterLogEvents natively, so unlike the metrics path there is no
      hand-rolled signer and no read secret.
    advisory: >-
      When a stakeholder asks whether measuring agent behaviour means
      surveilling the developer, the honest and usually correct answer is that
      the useful signal is metadata: whether an edit was kept, which tool ran,
      how long a call took, how many prompts came and how long they were — none
      of which is the content. Turn the content flags OFF and keep them off, and
      state the posture structurally (no prompt, file or tool-argument text is
      emitted, stored or shown) rather than promising to redact something you
      chose never to collect. Two engineering riders travel with it. First,
      store durations and lengths as SUMMABLE fixed-edge histograms, not raw
      samples or per-day percentiles — a window p90 is then the p90 of the
      summed buckets, which is exact, where averaging daily percentiles is not;
      report the bucket's upper edge and say so, an honest over-estimate beats a
      fabricated point value. Second, telemetry is not retroactive and it is
      per-tool: only turns run through the opt-in launch wrapper are measured,
      and a second agent's log schema does not carry over — assume you re-earn
      the signal for each tool.
    refs:
      - D59
      - build-notes/claude/08-coding-agent-telemetry.md
      - src/observability/coding_logs_source.py
      - scripts/claude_otel.sh
      - plan/07-workstreams.md

  - id: agentforce-otel-same-data-standard-route
    category: Observability
    # New 2026-08-12 from WS23 (D73): the Agentforce Session Trace OTel API is a
    # standards-shaped route to the SAME obs data we already harvest from the
    # DMOs. observed rung — WS23 item 7 validated the mapping against a live beta
    # org 2026-08-12 (25 sessions enumerated, a real session's OTel GET returned
    # an OTLP doc: 1 resourceSpans, 12 spans; plan/07-workstreams.md item 7).
    # Not `measured` — a single live-org validation against a beta endpoint that
    # may move, not a repeated measurement.
    status: observed
    headline: >-
      A vendor's new "OpenTelemetry API" is usually a STANDARD ROUTE to data you
      could already get — the win is the pre-joined schema, not new information
    evidence: >-
      Agentforce shipped a Session Trace OTel API (beta) that returns a session's
      trace as an OTLP/JSON resourceSpans document — turns, messages, LLM calls,
      actions, metric scores and feedback, each a span. The lab already harvests
      that same picture the hard way: SELECT FIELDS(ALL) over four Session
      Tracing DMOs (ssot__AiAgentSession/Interaction/InteractionMessage/
      InteractionStep__dlm), a manual interaction→session foreign-key walk,
      200-row OFFSET paging, backfill of referenced sessions, and field-name
      heuristics because the ssot__* column names drift between orgs. Reading the
      docs against that DMO source, the OTel endpoint is the SAME Data 360 record
      through a pre-joined view — so it changes retrieval, not truth: no
      dashboard number would move. What it removes is real: the server does the
      join (the orphan bug class that once stranded 823 events in Aurora cannot
      occur), a stable OTLP schema replaces the drift-prone column heuristics,
      and it is one round trip per session instead of four paged DMO scans. What
      ruled out switching the LIVE harvest is three beta limits, each fatal to a
      bulk coverage sweep: single-session only (no bulk read), 72h lookback, and
      beta. So the lab built the OTel source (salesforce-otel), tested the OTLP→
      store mapping, and kept the DMO path live — a one-line promotion the day
      the API grows a bulk read. (Validated against a live org 2026-08-12 —
      WS23 item 7: the runtime session id resolves to the OTel endpoint and the
      OTLP attribute names match the mapping's hints.)
    advisory: >-
      When a platform announces an "OpenTelemetry" or "standard trace" API,
      ask first whether it is new DATA or a new ROUTE to data you can already
      reach — usually the latter, a pre-joined projection of the same store. That
      reframes the decision: the payoff is a stabler schema and fewer join bugs,
      not richer analysis, so weigh it as an ENGINEERING simplification, not a
      capability. And do not switch your live pull to a beta endpoint just
      because it is cleaner: if it is single-session or short-lookback where your
      current path is bulk-and-historical, build it alongside under its own name,
      prove it is byte-for-byte the same data, and keep the promotion one line
      away — capability without overclaiming it replaces the measured path.
    refs:
      - D73
      - plan/05-observability.md
      - plan/07-workstreams.md
      - src/observability/salesforce_otel_source.py
      - src/observability/salesforce_source.py
