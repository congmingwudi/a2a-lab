# Target registry: every remote agent the lab can call, resolved by the
# bridge, the shims, custom tools, and scripts/matrix.py.
#
# status legend (be honest — this feeds plan/02-matrix.md):
#   native       the platform speaks this protocol itself
#   via-bridge   Path A: Agentforce REST callout -> bridge -> this protocol
#   via-shim     Path B: this protocol -> shim -> Agentforce Agent API
#   blocked-beta the native path exists but is gated (documented, not run)
#
# ${VAR} values expand from the environment (.env).

# Our own servers (claude-*, shims) enforce A2ALAB_TOKEN when set, so every
# client hop to them sends it; unset (local dev) both sides skip auth.
targets:
  # ---- Claude research agent (hosted by us; backend = managed|sdk via CLAUDE_BACKEND)
  claude-rest:
    platform: claude
    protocol: rest
    endpoint: http://localhost:8001
    status: native
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}
  claude-mcp:
    platform: claude
    protocol: mcp
    endpoint: http://localhost:8002/mcp
    status: native
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}
  claude-a2a:
    platform: claude
    protocol: a2a
    endpoint: http://localhost:8003
    status: native
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}
  # ---- Lab Guide (hosted by us) — the console docent served as a lab agent
  # over all three protocols (the meta exhibit, plan/07). Its MCP server also
  # exposes raw read tools (get_decision, get_trace, …) for client-side
  # reasoning — demonstrable from Claude Desktop.
  guide-rest:
    platform: guide
    protocol: rest
    endpoint: http://localhost:8031
    status: native
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}
  guide-mcp:
    platform: guide
    protocol: mcp
    endpoint: http://localhost:8032/mcp
    status: native
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}
  guide-a2a:
    platform: guide
    protocol: a2a
    endpoint: http://localhost:8033
    status: native
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}
  # The AWS-hosted twin (D26): the sdk backend containerized on Bedrock
  # AgentCore Runtime — the self-hosted counterpart to the Managed Agents
  # default, and the apples-to-apples peer of openai-agentcore. Same
  # deploy path: deploy/agentcore/deploy.sh claude
  claude-agentcore:
    platform: claude
    protocol: agentcore-http
    status: native
    # warmup: cold starts (~56s here, ~31s openai) blow demo budgets — the
    # console's warm-up panel pings flagged targets and records durations
    options: {timeout: 110, warmup: true}
    auth: {runtime_arn: "${CLAUDE_AGENTCORE_ARN}"}

  # ---- Agentforce (hosted by Salesforce)
  agentforce-rest:
    platform: agentforce
    protocol: agentforce-api   # GA Agent API — the native cell
    status: native
  agentforce-mcp:
    platform: agentforce
    protocol: mcp
    endpoint: http://localhost:8021/mcp
    status: via-shim
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}
  agentforce-a2a:
    platform: agentforce
    protocol: a2a
    endpoint: http://localhost:8023
    status: via-shim
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}

  # The OpenAI-paired Agentforce twin (ADR D25): same org/credentials,
  # different agent — its external-research action targets openai-rest.
  agentforce-openai-rest:
    platform: agentforce
    protocol: agentforce-api
    status: native
    auth:
      my_domain: "${SF_MY_DOMAIN}"
      client_id: "${SF_CLIENT_ID}"
      client_secret: "${SF_CLIENT_SECRET}"
      agent_id: "${SF_OPENAI_AGENT_ID}"

  # ---- OpenAI agent (M9/Path C — hosted by us; backend = stub|agents-sdk
  # via OPENAI_BACKEND; the agents-sdk backend is the Codex deliverable,
  # plan/06-openai-codex-handoff.md)
  openai-rest:
    platform: openai
    protocol: rest
    endpoint: http://localhost:8011
    status: native
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}
  openai-mcp:
    platform: openai
    protocol: mcp
    endpoint: http://localhost:8012/mcp
    status: native
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}
  openai-a2a:
    platform: openai
    protocol: a2a
    endpoint: http://localhost:8013
    status: native
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}
  # The AWS-hosted variant (D4/D24): Bedrock AgentCore Runtime, IAM-authed
  # data plane (invoke_agent_runtime) — no raw HTTP endpoint exists, so the
  # client is boto3-based. Same container handler as openai-rest.
  openai-agentcore:
    platform: openai
    protocol: agentcore-http
    status: native
    options: {timeout: 110, warmup: true}
    auth: {runtime_arn: "${OPENAI_AGENTCORE_ARN}"}

  # ---- AWS Strands agent (WS5/D66 — hosted by us; backend = stub|strands-sdk
  # via STRANDS_BACKEND; the strands-sdk backend is Kiro's deliverable,
  # plan/12-strands-kiro-handoff.md). Third framework on the IDENTICAL Bedrock
  # AgentCore runtime as claude-agentcore and openai-agentcore — the point of
  # WS5 is to isolate the FRAMEWORK variable at a constant runtime and model
  # cloud (Bedrock). The three local faces run the stub until Kiro delivers.
  strands-rest:
    platform: strands
    protocol: rest
    endpoint: http://localhost:8041
    status: native
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}
  strands-mcp:
    platform: strands
    protocol: mcp
    endpoint: http://localhost:8042/mcp
    status: native
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}
  strands-a2a:
    platform: strands
    protocol: a2a
    endpoint: http://localhost:8043
    status: native
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}
  # The AWS-hosted twin: Bedrock AgentCore Runtime, IAM data plane
  # (invoke_agent_runtime) — no raw HTTP endpoint, boto3 client. Same
  # container handler as strands-rest. Deploy: deploy/agentcore/deploy.sh
  # strands. Live since 2026-08-04: Kiro delivered strands-sdk (plan/12), the
  # runtime is created, and the strands-to-agentforce scenario runs against it
  # (model claude-haiku-4-5 on Bedrock via the runtime IAM role).
  strands-agentcore:
    platform: strands
    protocol: agentcore-http
    status: native
    options: {timeout: 110, warmup: true}
    auth: {runtime_arn: "${STRANDS_AGENTCORE_ARN}"}

  # The Strands-paired Agentforce twin (ADR D25): same org/credentials,
  # different agent — its external-research action targets strands-rest, never
  # Claude/OpenAI, so this experiment stays a closed two-platform system.
  agentforce-strands-rest:
    platform: agentforce
    protocol: agentforce-api
    status: native
    auth:
      my_domain: "${SF_MY_DOMAIN}"
      client_id: "${SF_CLIENT_ID}"
      client_secret: "${SF_CLIENT_SECRET}"
      agent_id: "${SF_STRANDS_AGENT_ID}"

  # The ADK-paired Agentforce twin (ADR D25): same org/credentials,
  # different agent — its external-research action targets adk-a2a.
  agentforce-google-adk-rest:
    aliases: [agentforce-adk-rest]
    platform: agentforce
    protocol: agentforce-api
    status: native
    auth:
      my_domain: "${SF_MY_DOMAIN}"
      client_id: "${SF_CLIENT_ID}"
      client_secret: "${SF_CLIENT_SECRET}"
      agent_id: "${SF_ADK_AGENT_ID}"

  # ---- Google ADK agent (WS2 — hosted on Vertex AI Agent Engine)
  # The lab's first remote cell where the PLATFORM speaks A2A natively:
  # both ends native, no bridge, no shim. IAM data plane (google-adc
  # bearer), card served at /v1/card (not /.well-known). Scale-to-zero
  # (min_instances=0, personal GCP account) — hence warmup.
  agentforce-a2a-shim:
    platform: agentforce
    protocol: a2a
    # The AWS-hosted shim (D28) as a first-class cell + warm-up entry: the
    # fail-safe for demo cold starts on platform-side tool calls (Foundry's
    # A2A tool does not retry). The delegated warm-up ping pre-creates the
    # foundry-keyed twin session behind API Gateway's 29s ceiling.
    endpoint: ${AF_SHIM_A2A_URL}
    status: via-shim
    options:
      timeout: 35
      warmup: true
      warmup_delegated_platform: foundry
    auth:
      header_name: x-lab-token
      header_value: ${A2ALAB_TOKEN}
  agentforce-foundry-rest:
    platform: agentforce
    protocol: agentforce-api
    status: native
    auth:
      my_domain: ${SF_MY_DOMAIN}
      client_id: ${SF_CLIENT_ID}
      client_secret: ${SF_CLIENT_SECRET}
      agent_id: ${SF_FOUNDRY_AGENT_ID}

  # WS8 orchestrator variant 3 (D61): the supplier-disruption fan-out
  # orchestrated by an Agentforce agent authored in Agent Script — the third
  # point on the who-owns-concurrency axis (host / graph / serial-Apex). The
  # console talks to it over the GA Agent API like any twin; the fan-out
  # happens INSIDE Agentforce, via the orchestrator's Apex → bridge. The two
  # topologies (serial-native vs delegated parallel) are picked per run and
  # branch inside the Agent Script — not a different target.
  agentforce-orchestrator-rest:
    platform: agentforce
    protocol: agentforce-api
    status: native
    auth:
      my_domain: ${SF_MY_DOMAIN}
      client_id: ${SF_CLIENT_ID}
      client_secret: ${SF_CLIENT_SECRET}
      agent_id: ${SF_ORCHESTRATOR_AGENT_ID}
  foundry-rest:
    platform: foundry
    protocol: foundry-api
    # The platform's own front door (D15 entry): the project's Responses
    # surface with an agent_reference. No endpoint here — the client builds
    # it from AZURE_FOUNDRY_PROJECT_ENDPOINT. Auth is an explicit Entra
    # SERVICE PRINCIPAL, never DefaultAzureCredential (D39) — this comment
    # said "ADC" until 2026-07-28, which describes the one thing
    # platforms/foundry/core.py refuses to do, and reads as though the cell
    # depends on a developer's own az login. 100s: the
    # client retries a failed platform-side tool call once (cold shim leg
    # ~30s + warmed retry ~40s must both fit).
    status: native
    options:
      timeout: 100
      agent_name: a2alab-foundry-researcher
      # Force the platform-side tool call: the model skips its delegation
      # ~half the time otherwise (and can fabricate the skipped answer).
      tool_choice: required
  foundry-a2a:
    platform: foundry
    protocol: a2a
    # Foundry Agent Service incoming A2A (preview): platform-native
    # endpoint, Entra-only auth (no key option), JSONRPC binding, cards
    # served per protocol version (v1.0 / v0.3) at custom paths.
    endpoint: ${AZURE_FOUNDRY_PROJECT_ENDPOINT}/agents/a2alab-foundry-researcher/endpoint/protocols/a2a
    status: native
    options:
      timeout: 65
      card_path: agentCard/v1.0
    auth:
      scheme: azure-ad
  # WS8 fan-out leg: the Commercial/Legal business unit's dedicated agent.
  # Same platform, transport and auth as the researcher above — a different
  # AGENT, so Foundry's own App Insights spans attribute this experiment
  # separately from WS3's.
  foundry-commercial-a2a:
    platform: foundry
    protocol: a2a
    endpoint: ${AZURE_FOUNDRY_PROJECT_ENDPOINT}/agents/a2alab-commercial-agent/endpoint/protocols/a2a
    status: native
    options:
      timeout: 65
      card_path: agentCard/v1.0
    auth:
      scheme: azure-ad
  google-adk-a2a:
    aliases: [adk-a2a]  # the ADK twin's published script pins this bridge target
    platform: adk
    protocol: a2a
    endpoint: "${ADK_A2A_ENDPOINT}"
    status: native
    # transport pinned: the preview A2A surface serves messages but its
    # public card route 404s — the client builds a minimal card locally
    # instead of discovering (honest preview roughness, noted in matrix)
    options: {timeout: 65, transport: http_json, warmup: true}
    auth: {scheme: google-adc}
  # WS8 fan-out leg: the Logistics business unit's dedicated agent, its OWN
  # Agent Engine deployment (deploy/adk/deploy_adk.py --role logistics) so
  # Cloud Logging attributes this experiment separately from the researcher.
  adk-logistics-a2a:
    platform: adk
    protocol: a2a
    endpoint: "${ADK_LOGISTICS_A2A_ENDPOINT}"
    status: native
    options: {timeout: 65, transport: http_json, warmup: true}
    auth: {scheme: google-adc}
  # WS8 orchestrator variant 2: the same fan-out with concurrency DECLARED in
  # the agent graph (SequentialAgent[ParallelAgent[3 units], synthesiser])
  # rather than executed host-side by a custom tool. Self-contained — it fans
  # out from inside the container, so no lab host is attached while it runs.
  adk-orchestrator-a2a:
    platform: adk
    protocol: a2a
    endpoint: "${ADK_ORCHESTRATOR_A2A_ENDPOINT}"
    status: native
    # a fan-out of three legs inside one turn: the whole point is that it
    # takes the slowest leg, but that is still slower than a single hop
    options: {timeout: 180, transport: http_json, warmup: true}
    auth: {scheme: google-adc}

# Deployment modes (D26): A2ALAB_MODE=hosted transparently remaps these
# names wherever a client is resolved (bridge, custom tools, console runs) —
# one env flip moves every experiment from local servers to the AgentCore
# runtimes with no Salesforce or scenario changes. scripts/matrix.py is
# exempt (exact=True): a matrix cell always measures the target it names.
# Restart the stack after flipping — bridge/console cache clients per name.

  claude-rest-hosted:
    platform: claude
    protocol: rest
    endpoint: ${A2ALAB_FACES_BASE}/claude-rest
    status: native
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}

  openai-rest-hosted:
    platform: openai
    protocol: rest
    endpoint: ${A2ALAB_FACES_BASE}/openai-rest
    status: native
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}

  # ---- Hosted twins of the nine local protocol faces (WS13 item 2) ----
  # One Fargate service serves all of them, addressed by PATH under one
  # hostname — see src/faces/__init__.py. `modes.hosted` below swaps each
  # localhost cell for its twin, so A2ALAB_MODE=hosted needs no laptop.
  # The twins are the SAME adapters behind the SAME auth as the local ones;
  # only the address differs, which is what keeps the protocol comparison
  # honest.

  claude-mcp-hosted:
    platform: claude
    protocol: mcp
    endpoint: ${A2ALAB_FACES_BASE}/claude-mcp/mcp
    status: native
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}

  claude-a2a-hosted:
    platform: claude
    protocol: a2a
    endpoint: ${A2ALAB_FACES_BASE}/claude-a2a
    status: native
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}

  openai-mcp-hosted:
    platform: openai
    protocol: mcp
    endpoint: ${A2ALAB_FACES_BASE}/openai-mcp/mcp
    status: native
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}

  openai-a2a-hosted:
    platform: openai
    protocol: a2a
    endpoint: ${A2ALAB_FACES_BASE}/openai-a2a
    status: native
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}

  guide-rest-hosted:
    platform: guide
    protocol: rest
    endpoint: ${A2ALAB_FACES_BASE}/guide-rest
    status: native
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}

  guide-mcp-hosted:
    platform: guide
    protocol: mcp
    endpoint: ${A2ALAB_FACES_BASE}/guide-mcp/mcp
    status: native
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}

  guide-a2a-hosted:
    platform: guide
    protocol: a2a
    endpoint: ${A2ALAB_FACES_BASE}/guide-a2a
    status: native
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}

  agentforce-mcp-hosted:
    platform: agentforce
    protocol: mcp
    endpoint: ${A2ALAB_FACES_BASE}/agentforce-mcp/mcp
    status: via-shim
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}

  agentforce-a2a-hosted:
    platform: agentforce
    protocol: a2a
    endpoint: ${A2ALAB_FACES_BASE}/agentforce-a2a
    status: via-shim
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}

  # WS5 hosted twins: the strands faces served by the SAME faces task as the
  # others. They run the stub backend until Kiro delivers strands-sdk and the
  # faces image carries the `strands` extra (plan/12) — same address, only the
  # backend differs, which keeps the protocol comparison honest.
  strands-rest-hosted:
    platform: strands
    protocol: rest
    endpoint: ${A2ALAB_FACES_BASE}/strands-rest
    status: native
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}
  strands-mcp-hosted:
    platform: strands
    protocol: mcp
    endpoint: ${A2ALAB_FACES_BASE}/strands-mcp/mcp
    status: native
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}
  strands-a2a-hosted:
    platform: strands
    protocol: a2a
    endpoint: ${A2ALAB_FACES_BASE}/strands-a2a
    status: native
    auth: {header_name: x-lab-token, header_value: "${A2ALAB_TOKEN}"}

modes:
  # WS13/D55: claude-rest and openai-rest used to remap to the AGENTCORE
  # runtimes here. That was right while the protocol faces were laptop-only —
  # AgentCore was the sole hosted option — and became wrong the moment the
  # faces were hosted (D51), because AgentCore runs the SELF-HOSTED SDK twin.
  # The effect was that `claude-to-agentforce` ("Claude Managed Agent →
  # Agentforce") and `claude-aws-to-agentforce` ran the same backend in hosted
  # mode, while the pair exists to compare Managed Agents AGAINST self-hosted.
  # The faces serve CLAUDE_BACKEND=managed, so these now point there and the
  # agentcore cells keep their own scenarios.
  hosted:
    claude-rest: claude-rest-hosted
    openai-rest: openai-rest-hosted
    claude-mcp: claude-mcp-hosted
    claude-a2a: claude-a2a-hosted
    openai-mcp: openai-mcp-hosted
    openai-a2a: openai-a2a-hosted
    guide-rest: guide-rest-hosted
    guide-mcp: guide-mcp-hosted
    guide-a2a: guide-a2a-hosted
    agentforce-mcp: agentforce-mcp-hosted
    agentforce-a2a: agentforce-a2a-hosted
    strands-rest: strands-rest-hosted
    strands-mcp: strands-mcp-hosted
    strands-a2a: strands-a2a-hosted
