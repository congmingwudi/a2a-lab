# Credentials whose expiry no API will tell us, asserted by hand.
#
# scripts/expiry_report.py queries AWS IAM, ACM, Entra and GCP directly;
# anything here is a NOTE someone wrote, reported as `source: declared` so the
# console can show it differently. An asserted date must never read as a
# measured one.
#
# Each credential gets its OWN row even when several share a review date. The
# per-caller Salesforce apps (D37 F3/F6) are separate External Client Apps with
# separate consumer secrets — they diverge the moment one is rotated, and a
# single "Salesforce secrets" row would hide exactly that.
#
# Names only — no account ids, no org ids, no project ids (CLAUDE.md).
credentials:
  # ---- Salesforce External Client Apps (D37 F3/F6) --------------------------
  # Salesforce does not expire consumer secrets on a schedule, so every date
  # below is a self-imposed review, one year from the per-caller split on
  # 2026-07-24. Rotation is per app; the runbook is plan/04-runbooks.md.
  - name: SF ECA — a2a_lab_claude (Claude runtime caller)
    kind: client-secret
    expires: 2027-07-24
    detail: >-
      Per-caller app for the Claude AgentCore runtime; scopes chatbot_api +
      sfap_api. No platform expiry — this is a review date.
  - name: SF ECA — a2a_lab_openai (OpenAI runtime caller)
    kind: client-secret
    expires: 2027-07-24
    detail: >-
      Per-caller app for the OpenAI AgentCore runtime; scopes chatbot_api +
      sfap_api. No platform expiry — this is a review date.
  - name: SF ECA — a2a_lab_shim (hosted A2A/MCP shim)
    kind: client-secret
    expires: 2027-07-24
    detail: >-
      Per-caller app for the Lambda shim (D28); scopes chatbot_api + sfap_api.
      No platform expiry — this is a review date.
  - name: SF ECA — a2a_lab_obs (observability harvest)
    kind: client-secret
    expires: 2027-07-24
    detail: >-
      The only caller holding `api` — it reads Data Cloud DMOs for the M11
      harvest. No platform expiry — this is a review date.
  - name: SF ECA — a2a_lab_app (local development)
    kind: client-secret
    expires: 2027-07-24
    detail: >-
      The shared app kept for local development only; hosted seams use their
      own. No platform expiry — this is a review date.

  # ---- Lab-internal keys ----------------------------------------------------
  - name: Cloudflare tunnel credential
    kind: key
    expires: 2027-07-12
    detail: >-
      Named-tunnel credential in ~/.cloudflared (D20). No stated expiry; this
      is a one-year review from creation. Re-create with
      `cloudflared tunnel create`.
  - name: Lab persona JWT signing key
    kind: key
    expires: 2027-07-24
    detail: >-
      RSA key in .a2alab signing console persona tokens (D36). No expiry of its
      own; tokens it issues live 8h. Rotating it signs everyone out, which is
      the intended blast radius.
  - name: Bridge and lab shared tokens
    kind: shared-secret
    expires: 2027-07-24
    detail: >-
      BRIDGE_TOKEN and A2ALAB_TOKEN, in .env and the per-seam Secrets Manager
      secrets. No expiry; rotating means updating .env, re-running the deploys,
      and the Salesforce External Credential parameter.
