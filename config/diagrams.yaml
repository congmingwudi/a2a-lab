# Diagrams for the readout — mermaid sources rendered in the console's
# Insights section (a chip on each insight tile opens the diagram) and
# embedded into plan/08-insights.md by scripts/export_insights.py.
#
# Each entry:
#   id        stable slug, used as the chip's key
#   title     chip label AND the modal heading — keep it short, it is a chip
#   caption   one line under the diagram: what to SAY when it is on screen
#   insights  ids from config/insights.yaml whose tiles carry this chip
#   readme    true when README.md embeds the same diagram — tests/unit/
#             test_diagrams.py asserts the two copies stay identical, so a
#             diagram edited in one place fails the suite until both match
#   mermaid   the diagram source (flowchart syntax; parsed in tests)

diagrams:
  - id: identity-and-secrets
    title: "Who authenticates as what"
    caption: >
      Every hosted seam loads its credentials from its own Secrets Manager secret (F1/D39), so runtime configs carry only a secret ARN. The callers with a dedicated job present a per-caller External Client App (F6/D37): claude, openai, shim, obs, tab_embed, and the memory ECA via JWT-bearer (D83/D91). The bridge, faces, briefs and console still also hold the shared a2a_lab_app pair.
    insights: [least-privilege-is-identity, credential-locality]
    readme: true
    mermaid: |
      flowchart LR
          subgraph sm["AWS Secrets Manager (F1)"]
              SC["a2alab/runtime/claude"]
              SO["a2alab/runtime/openai"]
              SS["a2alab/runtime/shim"]
              SCON["a2alab/runtime/console"]
              SB["a2alab/runtime/bridge"]
              SF["a2alab/runtime/faces"]
              SBR["a2alab/runtime/briefs"]
              SST["a2alab/runtime/strands"]
              SFAN["a2alab/runtime/fanout-mcp"]
              SH["a2alab/obs/harvest (D23)"]
          end

          ACC["AgentCore: Claude"] --> SC
          ACO["AgentCore: OpenAI"] --> SO
          HSHIM["Hosted A2A shim"] --> SS
          CON["Console"] --> SCON
          HARV["Obs harvest"] --> SH
          BR["Bridge (Fargate)"] --> SB
          FACES["Faces (Fargate)"] --> SF
          BRIEFS["Briefs task"] --> SBR
          ACS["AgentCore: Strands"] --> SST
          FAN["Fan-out MCP Lambda"] --> SFAN

          SC -- "a2a_lab_claude<br/>chatbot_api, sfap_api" --> AAPI["Agentforce<br/>Agent API"]
          SO -- "a2a_lab_openai<br/>chatbot_api, sfap_api" --> AAPI
          SS -- "a2a_lab_shim<br/>chatbot_api, sfap_api" --> AAPI
          SH -- "a2a_lab_obs<br/>api" --> DMO[("Data Cloud DMOs")]
          SCON -- "a2a_lab_tab_embed<br/>web via JWT-bearer (frontdoor, WS19)" --> TAB["Tableau Next<br/>embed session"]
          SCON -- "a2a_lab_obs<br/>api" --> DMO
          SB -- "a2a_lab_app (shared)" --> AAPI
          SB -- "a2a_lab_memory<br/>JWT-bearer, run-as user (D83)" --> MEM["Data 360 Agentic Memory<br/>/memory/turn"]
          SF -- "a2a_lab_memory<br/>aid + customer xid (D91/D104)" --> MEM
          SCON -- "a2a_lab_memory<br/>case preflight + seed/recall (D102)" --> MEM
          SBR -- "a2a_lab_app (shared)<br/>writes A2ALab_Account_Brief__c" --> SFORG[("Salesforce org")]
  - id: console-two-mints
    title: "One signing key, two public mints"
    caption: >
      /api/login and /oauth/token are peer credential exchanges on the same console task, holding the same RS256 signing key — a human persona password mints an 8h browser session, a machine client_credentials mints a short-lived service JWT for a caller like the MuleSoft Omni Gateway, deployed to Production (WS10 SP1; stopped 2026-10-20, restarted 2026-10-29).
    insights: [credential-locality, least-privilege-is-identity]
    readme: false
    mermaid: |
      flowchart LR
          subgraph CONSOLE["Console task (Fargate) — one signing key, two public mints"]
              KEY[("A2ALAB_JWT_PRIVATE_KEY (RS256)")]
              LOGIN["POST /api/login<br/>persona + shared password (D36)"]
              OAUTH["POST /oauth/token<br/>client_credentials (WS10 SP1)"]
              LOGIN --> KEY
              OAUTH --> KEY
          end

          HUMAN["Signed-in operator/viewer<br/>browser bearer token, 8h TTL"]
          MULE["MuleSoft Omni Gateway<br/>agent-network-shared-gw<br/>Production, edge 1.13.5 · broker deployed<br/>stopped 2026-10-20, restarted 2026-10-29"]

          HUMAN -- "username + password" --> LOGIN
          MULE -- "gateway client id/secret" --> OAUTH
          KEY -- "8h persona JWT" --> HUMAN
          KEY -- "short-lived JWT<br/>sub=mulesoft-omni-gateway" --> MULE
  - id: platform-map
    title: "The platform map"
    caption: >
      Seven platforms, every pair a closed two-platform system — and the lab is the only thing that speaks all three protocols in both directions. WS10 SP1 adds a seventh path, the MuleSoft Agent Fabric broker: the buy-side comparator the console reaches as an ordinary A2A target, fanning back to the same faces.
    insights: [protocol-reality-check, emergent-topology, when-to-federate]
    readme: true
    mermaid: |
      flowchart LR
          subgraph sforg["Salesforce prod org"]
              TWINS["Agentforce twins (D25)<br/>Claude-paired · OpenAI-paired<br/>ADK-paired · Foundry-paired · Strands-paired"]
              APEX["Apex invocables<br/>InvokeRemoteAgent (bridge)<br/>InvokeAgentEngine (direct, D30)"]
              AGENTAPI["GA Agent API"]
              STDM[("Session Tracing DMOs")]
              TWINS --> APEX
              AGENTAPI -. sessions .-> STDM
          end

          subgraph lab["AWS us-east-1 — ECS Fargate behind the bridge ALB (the two seams)"]
              BR["Bridge (a2alab-bridge)<br/>REST in, any protocol out"]
              SRV["Protocol faces (a2alab-faces, one process, by path)<br/>REST · MCP · A2A"]
              GUIDE["Lab Guide faces (D35)<br/>in a2alab-faces"]
              SHIMS["Agentforce shim faces<br/>MCP · A2A, in a2alab-faces"]
              CONSOLE["Console (a2alab-console)<br/>host rule on the bridge ALB"]
          end

          subgraph aws["AWS"]
              ACC["AgentCore: Claude sdk"]
              ACO["AgentCore: OpenAI Agents SDK"]
              ACS["AgentCore: Strands SDK<br/>(Bedrock model, D66)"]
              HSHIM["Hosted A2A shim (Lambda + API GW)<br/>0.3↔1.x translation + wiretap"]
              OBSDB[("Aurora obs + trace store (D23)")]
          end

          CMA["Anthropic<br/>Managed Agents"]
          ADK["Google Vertex AI<br/>Agent Engine — native A2A"]
          FDY["Microsoft Foundry<br/>native A2A, Entra-only"]
          LG["LangGraph on Heroku (D77)<br/>3 faces, one web dyno"]

          MULEBK["MuleSoft Agent Fabric (WS10 SP1)<br/>Omni Gateway + AgentScript broker<br/>CloudHub 2.0 us-east-1 · Production, edge 1.13.5"]

          APEX -- "Path A: REST callout<br/>via ALB (D50/D51)" --> BR
          APEX -- "direct A2A (D30)" --> ADK
          BR -- "rest | mcp | a2a<br/>per targets.yaml (hosted twins, D26)" --> SRV
          BR -- "target names *-agentcore<br/>agentcore-http, IAM (D68)" --> ACC
          BR --> ACO
          BR --> ACS
          BR -- "A2A fire-then-poll (submit_poll)" --> LG
          LG -- ask_agentforce --> AGENTAPI
          SRV --> CMA
          SRV -- "Path B: ask_agentforce" --> AGENTAPI
          SHIMS --> AGENTAPI
          ACC -- ask_agentforce --> HSHIM
          ACO --> HSHIM
          ACS --> HSHIM
          ADK -- A2A --> HSHIM
          FDY -- "A2A (0.3 dialect)" --> HSHIM
          ADK -- "cross-hyperscaler A2A" --> FDY
          HSHIM --> AGENTAPI
          CONSOLE -- "A2A run: mule-broker-a2a<br/>(protocol-generic client)" --> MULEBK
          MULEBK -- "broker egress: oauth2-cc then A2A (lf.a2a.v1)<br/>consult → faces (end-to-end unproven)" --> SRV
          CONSOLE -.scenarios.-> BR
          CONSOLE -.reads.-> OBSDB
          HSHIM -.hops.-> OBSDB
          ACC -.hops.-> OBSDB
          STDM -.harvest.-> OBSDB
          CMA -.harvest.-> OBSDB
          ACS -. "harvest: AWS/Bedrock meters (D67)" .-> OBSDB
  - id: claude-pair-detail
    title: "One pair, end to end"
    caption: >
      The Claude ↔ Agentforce originals: one adapter behind three protocols, the managed sandbox that never holds a credential, and the local/hosted switch that moves the agent without touching Salesforce.
    insights: [managed-vs-self-hosted, sync-delegation-works]
    readme: true
    mermaid: |
      flowchart LR
          subgraph sforg["Salesforce prod org"]
              AF["Claude-paired twin<br/>A2ALab Research Assistant"]
              APEX["Apex invocable"]
              NC["Named Credential<br/>A2ALab_Bridge"]
              AGENTAPI["Agent API"]
              AF --> APEX --> NC
          end

          ALB["ALB a2alab-bridge<br/>bridge-lab.agenticthings.com<br/>idle timeout 120s"]
          BR["Bridge :8100 (Fargate)"]

          subgraph claude["src/platforms/claude — one adapter"]
              REST["REST :8001"]
              MCP["MCP :8002"]
              A2A["A2A :8003"]
              ADAPTER["ClaudeAdapter<br/>managed | sdk backend"]
              REST --> ADAPTER
              MCP --> ADAPTER
              A2A --> ADAPTER
          end

          CMA["Anthropic Managed Agents<br/>sandbox (beta)"]
          FACES["Fargate faces twin<br/>claude-rest-hosted (backend=managed)"]
          ACC["Bedrock AgentCore<br/>(sdk backend, agentcore-http)"]

          NC -- "X-Bridge-Token" --> ALB --> BR
          BR -- "protocol per targets.yaml" --> REST
          BR --> MCP
          BR --> A2A
          BR -. "A2ALAB_MODE=hosted<br/>(address swap, D26/D55)" .-> FACES
          BR -- "target names claude-agentcore<br/>IAM invoke, not a mode remap (D68)" --> ACC
          ADAPTER -- "sessions + event stream" --> CMA
          CMA -. "ask_agentforce tool call<br/>executed HOST-side" .-> ADAPTER
          ADAPTER -- "OAuth client-credentials" --> AGENTAPI
  - id: delegation-guard
    title: "The delegation guard"
    caption: >
      No agent protocol defines TTL or max-forwards semantics, so the lab stamps a versioned rider and refuses to forward past a depth limit — and that same text is what lands in the remote platform's own logs.
    insights: [delegation-ttl, text-rider-legitimacy, rider-provenance]
    readme: false
    mermaid: |
      flowchart LR
          A["Calling agent<br/>(any platform)"]
          SEAM["Delegation seam<br/>interop.delegation"]
          RIDER["Rider stamped into the message TEXT<br/>rider-version · caller-agent · caller-platform<br/>delegation-depth · lab-trace"]
          B["Delegated agent<br/>(remote platform)"]
          REF["Refusal returned<br/>wire-visible, zero calls made"]
          LOGS[("The remote platform's OWN logs<br/>rider text lands verbatim")]

          A --> SEAM
          SEAM -- "depth < A2ALAB_MAX_DELEGATION_DEPTH" --> RIDER --> B
          SEAM -- "depth >= the limit" --> REF
          B -. "no protocol carries this;<br/>the text does" .-> LOGS
  - id: a2a-version-spectrum
    title: "Versioned, not negotiated"
    caption: >
      Google requires A2A 1.0, Microsoft speaks 0.3, and neither negotiates — so interop across 'the same protocol' cost a bilingual card plus a translation layer the lab owns.
    insights: [versioning-not-negotiation, native-a2a-young]
    readme: false
    mermaid: |
      flowchart LR
          subgraph lab["Lab A2A surface — bilingual by necessity"]
              CARD["Agent card carries BOTH<br/>generations' fields"]
              COMPAT["a2a_compat middleware<br/>0.3 ⇄ 1.x translation"]
              SRV["a2a-sdk server (1.x)"]
              CARD --- COMPAT --> SRV
          end
          MS["Microsoft Foundry<br/>speaks 0.3 only"]
          GOOG["Vertex AI Agent Engine<br/>requires 1.0 only"]

          MS -- "0.3 JSON-RPC message/send<br/>a 1.x-only server answers -32601" --> COMPAT
          SRV -- "pinned a2a-version: 1.0<br/>omit it and you get VERSION_NOT_SUPPORTED" --> GOOG
  - id: fan-out-orchestration
    title: "Fan-out: three orchestrators"
    caption: >
      The same task, three business units, three clouds — orchestrated three ways, one axis: who owns the concurrency. On Managed Agents the fan-out is a custom tool the HOST executes; on ADK it is declared in the agent graph; on Agentforce there is no host tool and no parallel graph, so the orchestrator DELEGATES the fan-out to the lab bridge — the only way a serial-outbound platform still fans out.
    insights: [orchestration-topology]
    readme: true
    mermaid: |
      flowchart TB
          T["Supplier disruption task"] --> C
          T --> A
          T --> AF

          subgraph cma["Variant 1 - Anthropic Managed Agents"]
              C["Orchestrator agent<br/>declarative: prompt + tool schema"]
              C -- "custom tool" --> H["HOST executes<br/>asyncio.gather"]
          end

          subgraph adk["Variant 2 - Google ADK on Agent Engine"]
              A["SequentialAgent"] --> P["ParallelAgent<br/>framework schedules"]
              P --> S["synthesiser<br/>reads state keys"]
          end

          subgraph af["Variant 3 - Agentforce (Agent Script)"]
              AF["Orchestrator agent<br/>serial Apex is its only outbound"]
              AF -- "one delegated callout" --> BR["Lab bridge fanout: route<br/>runs orchestration.dispatch off-platform"]
          end

          H --> L1
          H --> L2
          H --> L3
          P --> L1
          P --> L2
          P --> L3
          BR --> L1
          BR --> L2
          BR --> L3

          L1["Logistics<br/>ADK · GCP"]
          L2["Commercial<br/>Foundry · Azure"]
          L3["Customer comms<br/>OpenAI · AWS"]

          L1 -.-> OBS[("join rate 1 of 4:<br/>only CMA is joinable<br/>from its own logs")]
          L2 -.-> OBS
          L3 -.-> OBS
          C -.-> OBS

  - id: behaviour-signal-content-off
    title: "Behavioural logs, content off"
    caption: >
      Every field the five insight families read is metadata that ships whether or not the content flags are set — so turning them off costs no insight and leaves nothing sensitive in the pipeline to leak.
    insights: [behaviour-survives-content-off]
    readme: false
    mermaid: |
      flowchart TB
          subgraph EV["Claude Code OTLP log events"]
              D["tool_decision<br/>decision · source"]
              R["tool_result<br/>tool_name · mcp_server_scope<br/>success · duration_ms"]
              Q["api_request<br/>model · duration_ms · tokens"]
              E["api_error / api_refusal<br/>status_code · attempt"]
              P["user_prompt<br/>prompt_length (a COUNT)"]
          end

          FLAGS["Content flags<br/>OTEL_LOG_USER_PROMPTS<br/>OTEL_LOG_TOOL_*<br/>default OFF — kept off"]
          FLAGS -. "never enabled:<br/>no prompt / file / arg TEXT" .-> EV

          D --> M["Metadata only"]
          R --> M
          Q --> M
          E --> M
          P --> M

          M --> AGG["coding_logs_source.py<br/>summable fixed-edge histograms<br/>aggregates only, one row per day"]
          AGG --> I["Five insight families:<br/>edit-acceptance · tool mix + MCP + latency<br/>request latency · reliability · prompt cadence"]

  - id: supplier-disruption-case-memory
    title: "Supplier disruption: Data 360 case memory"
    caption: >
      The console-hosted CMA run writes one bounded observation per specialist to a
      case-scoped Data 360 conversation. A later run can recall that episodic context
      for the coordinator, specialists, or both; profile-memory extraction remains off.
    insights: [orchestration-topology]
    readme: false
    mermaid: |
      flowchart LR
          subgraph RUN1["Seed run"]
              L["Logistics · ADK"]
              C["Commercial · Foundry"]
              O["Customer Ops · OpenAI"]
          end
          HOST["Console Fargate task<br/>CMA custom-tool host"]
          MEM[("Data 360 Agentic Memory<br/>opaque owner + case conversation")]
          RUN2["Later supplier-disruption run"]

          L -->|"bounded observation"| HOST
          C -->|"bounded observation"| HOST
          O -->|"bounded observation"| HOST
          HOST -->|"a2a_lab_memory · seed"| MEM
          MEM -->|"recall: coordinator / specialists / both"| HOST
          HOST --> RUN2

  - id: customer-memory-continuity
    title: "Customer continuity: Claude teaches, OpenAI recalls"
    caption: >
      A verified lab persona resolves to Maya's unified Data 360 Individual. Claude and
      OpenAI share one memory registration, A2ALab_Memory_Case, and the same governed xid
      (platform identity stays in the execution trace, not in memory partitions, D105); remembered customer
      context and each run's fresh Agentforce CRM contribution stay visibly distinct.
    insights: [credential-locality]
    readme: false
    mermaid: |
      flowchart LR
          USER["Verified lab persona"] -->|"environment-only mapping"| PROFILE["Unified Individual AM01<br/>Maya Chen"]
          USER --> C["Claude customer-memory run"]
          C -->|"A2ALab_Memory_Case · xid=Maya<br/>write + close"| MEM[("Data 360 Agentic Memory")]
          USER --> O["OpenAI customer-memory run"]
          MEM -->|"A2ALab_Memory_Case · same xid<br/>GetContext"| O
          C -->|"fresh CRM context"| AF["Agentforce"]
          O -->|"fresh CRM context"| AF
